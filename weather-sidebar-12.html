<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeoMundi AI Weather — Barre latérale</title>

  <style>
    /*
     * Widget D — barre latérale verticale (1 colonne × 12 lignes),
     * pour un placement en sidebar gauche ou droite. Même logique de
     * signal, de données et de tendance que le bandeau horizontal
     * (weather-bar-2x6.html) — format additionnel, en plus des
     * widgets B et C, ne les remplace pas.
     *
     * Fully self-contained — colors hardcoded here, no themes.css
     * dependency (same reasoning as the other AI Weather widgets).
     *
     * Configuration via URL only, no in-widget UI:
     *   lang=   en, fr, de, es, it, pt, nl, ru, ar, hi, ja, ko, zh
     *   theme=  light (default) | dark
     *
     * Mini trend line per row: same best-effort 7-day lookback over
     * data/history/<date>.json as the horizontal bar widget.
     *
     * 2026-08-26: date-only patch — added measurement date line
     * ("Mesuré le …" / "Measured on …") right after the title, before
     * the legend. Date source: data.generated_at (capsule generation
     * timestamp), NOT the visitor's local clock. Falls back to "now"
     * only if data.generated_at is ever missing. Theme count (2:
     * light/dark), 240px width, and every other structural element
     * left untouched on purpose — this is a minimal, date-only
     * change. The brand signature only moved from inline-next-to-title
     * to its own line below the list, to make room for the date under
     * the title.
     */

    :root {
      --card-bg: linear-gradient(180deg, #dceefa 0%, #edf7fc 55%, #ffffff 100%);
      --card-border: #cfe3f0;
      --row-divider: #d7e6f0;
      --logo-chip-bg: #eef0f3;
      --ink: #171b21;
      --ink-dim: #5b6270;
      --ink-faint: #9ba1ac;

      --clear: #22c55e;
      --watch: #facc15;
      --unsettled: #f97316;
      --alert: #ef4444;
    }

    [data-theme="dark"] {
      --card-bg: #1b1f26;
      --card-border: #2a2f38;
      --row-divider: #333944;
      --logo-chip-bg: #eef0f3;
      --ink: #f1f2f4;
      --ink-dim: #a6acb6;
      --ink-faint: #6b7280;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: transparent;
      color: var(--ink);
      font-family: "Segoe UI", "Inter", Arial, Helvetica, sans-serif;
    }

    .nm-state-msg { color: var(--ink-dim); font-size: 12px; padding: 12px; }

    .block {
      width: 100%;
      max-width: 240px;
      margin: 0 auto;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px 12px 11px;
    }

    .block-title-row {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 4px 8px;
      margin: 0 0 4px;
      padding: 0 2px;
    }

    .block-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .measured-date {
      font-size: 10px;
      color: var(--ink-dim);
      margin: 0 0 9px;
      padding: 0 2px;
    }

    .block-signature {
      font-size: 8.5px;
      color: var(--ink-faint);
      line-height: 1.5;
      margin: 9px 0 0;
      padding: 0 2px;
    }

    .block-signature .sig-line + .sig-line {
      margin-top: 2px;
    }

    .block-signature strong {
      font-weight: 700;
      color: var(--ink-dim);
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 10px;
      font-size: 10px;
      color: var(--ink-dim);
      margin: 0 0 10px;
      padding: 0 2px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .legend-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex: 0 0 7px;
    }

    .legend-clear     { background: var(--clear); }
    .legend-watch     { background: var(--watch); }
    .legend-unsettled { background: var(--unsettled); }
    .legend-alert     { background: var(--alert); }

    .list {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--row-divider);
      border-radius: 10px;
      overflow: hidden;
    }

    a.row {
      display: block;
      padding: 8px 9px 7px;
      text-decoration: none;
      color: inherit;
      border-bottom: 1px solid var(--row-divider);
      transition: background 0.15s ease;
    }

    a.row:last-child { border-bottom: none; }

    a.row:hover { background: rgba(55, 138, 221, 0.06); }

    .row-top {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .row-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex: 0 0 8px;
      border: 2px solid var(--card-bg);
    }

    .row.is-clear     .row-dot { background: var(--clear);     box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.35),  0 0 7px rgba(34, 197, 94, 0.45); }
    .row.is-watch     .row-dot { background: var(--watch);     box-shadow: 0 0 0 1px rgba(250, 204, 21, 0.45), 0 0 7px rgba(250, 204, 21, 0.50); }
    .row.is-unsettled .row-dot { background: var(--unsettled); box-shadow: 0 0 0 1px rgba(249, 115, 22, 0.40), 0 0 7px rgba(249, 115, 22, 0.48); }
    .row.is-alert     .row-dot { background: var(--alert);     box-shadow: 0 0 0 1px rgba(239, 68, 68, 0.40),  0 0 7px rgba(239, 68, 68, 0.48); }

    .row-name {
      flex: 1;
      min-width: 0;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-logo-wrap {
      width: 14px;
      height: 14px;
      flex: 0 0 14px;
      background: var(--logo-chip-bg);
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1px;
    }

    .row-logo { width: 100%; height: 100%; object-fit: contain; }

    .row-spark {
      width: 100%;
      height: 14px;
      display: block;
    }
  </style>
</head>
<body>

  <div class="block" id="block">
    <div class="nm-state-msg">Loading…</div>
  </div>

  <script src="./scripts/i18n.js"></script>
  <script src="./scripts/weather-data.js"></script>
  <!-- ControlTower widget telemetry -->
  <script src="./scripts/widget-telemetry.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const THEME = params.get("theme") === "dark" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", THEME);

    // Logo filenames live directly under ./assets/ (not ./assets/logos/)
    // and mostly match the system id. Two known exceptions:
    //  - "infomaniak" (the hosting provider) shows the NVIDIA model
    //    publicly, so its logo file is nvidia.png, not infomaniak.png.
    //  - "meta" -> the actual file on disk is capitalized (Meta.png).
    const LOGO_FILE_OVERRIDES = {
      infomaniak: "nvidia",
      meta: "Meta"
    };

    function logoTag(systemId) {
      const fileName = LOGO_FILE_OVERRIDES[systemId] || systemId;
      const src = `./assets/${encodeURIComponent(fileName)}.png`;
      return `<span class="row-logo-wrap"><img class="row-logo" src="${src}" alt="" loading="lazy" onerror="this.closest('.row-logo-wrap').remove()"></span>`;
    }

    function tOrFallback(key, fallback) {
      const value = NMi18n.t(key);
      return value === key ? fallback : value;
    }

    // Same short, per-language hover CTA used on the other AI Weather
    // widgets — kept identical for consistency.
    const TILE_CTA = {
      en: "See the AI Weather",
      fr: "Voir la météo des IA",
      de: "KI-Wetter ansehen",
      es: "Ver el clima de las IA",
      it: "Vedi il meteo delle IA",
      pt: "Ver o clima das IAs",
      nl: "Bekijk het AI-weer",
      ru: "Смотреть погоду ИИ",
      ar: "عرض طقس الذكاء الاصطناعي",
      hi: "एआई मौसम देखें",
      ja: "AIの天気を見る",
      ko: "AI 날씨 보기",
      zh: "查看AI天气"
    };

    // "Measured on" / "Mesuré le" prefix, localized, followed by the
    // capsule date formatted via toLocaleDateString(lang, ...) below.
    const MEASURED_PREFIX = {
      en: "Measured on",
      fr: "Mesuré le",
      de: "Gemessen am",
      es: "Medido el",
      it: "Misurato il",
      pt: "Medido em",
      nl: "Gemeten op",
      ru: "Измерено",
      ar: "قِيس في",
      hi: "मापा गया",
      ja: "測定日",
      ko: "측정일",
      zh: "测量日期"
    };

    // Brand signature: moved off the title row (2026-08-26), sits on
    // its own line below the list now, so the date can sit right
    // under the title. English-only regardless of ?lang= — same
    // product decision as the other AI Weather widgets.
    const BRAND_SIGNATURE = `
      <div class="sig-line">Runtime Interoperability JSON &middot; Schema validated &middot; Hash verifiable &middot; Signature verifiable</div>
      <div class="sig-line"><strong>NeoMundi</strong> &middot; the fundamental measurement layer for AI behavior</div>
      <div class="sig-line">One layer. Multiple uses. Heterogeneous infrastructures.</div>
    `;

    const CONDITION_VAR = {
      clear: "--clear",
      watch: "--watch",
      unsettled: "--unsettled",
      alert: "--alert"
    };

    function pad2(n) { return String(n).padStart(2, "0"); }
    function dateStr(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }

    // Measurement date shown to the visitor: the capsule's own
    // generated_at timestamp, NOT the visitor's local "now". Falls
    // back to "now" only if the field is ever missing, so the widget
    // never shows a blank line.
    function formatMeasuredDate(data, lang) {
      const raw = data && data.generated_at;
      const d = raw ? new Date(raw) : new Date();
      const prefix = MEASURED_PREFIX[lang] || MEASURED_PREFIX.en;
      const dateText = d.toLocaleDateString(lang, { day: "numeric", month: "long" });
      return `${prefix} ${dateText}`;
    }

    // Best-effort trend data: try the last 7 calendar days of
    // data/history/<date>.json, keep whichever exist, skip the rest.
    // Missing days (weekends, pipeline gaps) are not backfilled —
    // a sparse line is preferred over a fabricated one.
    function loadHistoryScores(systemIds) {
      const days = [];
      const today = new Date();
      for (let i = 0; i < 7; i++) {
        const d = new Date(today);
        d.setDate(d.getDate() - i);
        days.push(dateStr(d));
      }

      return Promise.allSettled(
        days.map(day =>
          fetch(`./data/history/${day}.json`).then(r => (r.ok ? r.json() : Promise.reject()))
        )
      ).then(results => {
        const snapshots = results
          .filter(r => r.status === "fulfilled" && r.value && Array.isArray(r.value.systems))
          .map(r => r.value);

        snapshots.sort((a, b) => new Date(a.generated_at || 0) - new Date(b.generated_at || 0));

        const scoresBySystem = {};
        systemIds.forEach(id => { scoresBySystem[id] = []; });

        snapshots.forEach(snap => {
          (snap.systems || []).forEach(s => {
            if (scoresBySystem[s.id] && typeof s.score === "number") {
              scoresBySystem[s.id].push(s.score);
            }
          });
        });

        return scoresBySystem;
      });
    }

    function sparklineSvg(scores, conditionVarName) {
      if (!scores || scores.length < 2) return "";

      const w = 80, h = 14, pad = 2;
      const min = Math.min(...scores);
      const max = Math.max(...scores);
      const range = max - min || 1;
      const stepX = (w - pad * 2) / (scores.length - 1);

      const points = scores.map((v, i) => {
        const x = pad + i * stepX;
        const y = h - pad - ((v - min) / range) * (h - pad * 2);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(" ");

      return `<svg class="row-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
        <polyline points="${points}" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
          style="stroke: var(${conditionVarName});"></polyline>
      </svg>`;
    }

    Promise.all([
      NMi18n.init(),
      fetch("./config/wording.json").then(r => r.ok ? r.json() : {}).catch(() => ({})),
      NMData.load(),
      NMData.loadPanels()
    ])
      .then(([lang, wording, data, panelsConfig]) => {
        const ids = (panelsConfig.panels && panelsConfig.panels.full) || (data.systems || []).map(s => s.id);
        const systems = NMData.getPanelSystems(data, ids);
        const block = document.getElementById("block");

        if (systems.length === 0) {
          block.innerHTML = '<div class="nm-state-msg">No matching systems.</div>';
          return;
        }

        const brandName = (wording.brand && wording.brand.name) || "ControlTower";
        const fullWeatherUrl = "https://controltowerai.io/ai-weather/";
        const tileCta = TILE_CTA[lang] || TILE_CTA.en;
        const measuredDateText = formatMeasuredDate(data, lang);

        loadHistoryScores(ids)
          .catch(() => ({}))
          .then(scoresBySystem => {
            const rowsHtml = systems.map(system => {
              const identity = NMData.getPublicIdentity(system);
              const conditionVar = CONDITION_VAR[system.condition] || "--ink-faint";
              const scores = (scoresBySystem && scoresBySystem[system.id]) || [];

              return `
                <a class="row is-${system.condition}" href="${fullWeatherUrl}" target="_blank" rel="noopener"
                   aria-label="${identity.label} — ${tileCta}" title="${tileCta}">
                  <div class="row-top">
                    <span class="row-dot" aria-hidden="true"></span>
                    <span class="row-name">${identity.label}</span>
                    ${logoTag(system.id)}
                  </div>
                  ${sparklineSvg(scores, conditionVar)}
                </a>
              `;
            }).join("");

            const legendHtml = `
              <span class="legend-item"><span class="legend-dot legend-clear"></span>${tOrFallback("judgment.j1", "Standard judgment")}</span>
              <span class="legend-item"><span class="legend-dot legend-watch"></span>${tOrFallback("judgment.j2", "Increased attention")}</span>
              <span class="legend-item"><span class="legend-dot legend-unsettled"></span>${tOrFallback("judgment.j3", "Heightened attention")}</span>
              <span class="legend-item"><span class="legend-dot legend-alert"></span>${tOrFallback("judgment.j4", "Critical attention")}</span>
            `;

            block.innerHTML = `
              <div class="block-title-row">
                <span class="block-title">${tOrFallback("ui.ai_weather_title", "AI Weather")}</span>
              </div>
              <div class="measured-date">${measuredDateText}</div>
              <div class="legend">${legendHtml}</div>
              <div class="list">${rowsHtml}</div>
              <div class="block-signature">${BRAND_SIGNATURE}</div>
            `;
          });
      })
      .catch(() => {
        document.getElementById("block").innerHTML =
          '<div class="nm-state-msg">AI Weather data unavailable.</div>';
      });
  </script>

</body>
</html>
