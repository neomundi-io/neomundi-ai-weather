<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeoMundi AI Weather — Bloc 3×4 (logos)</title>

  <style>
    /*
     * Widget B — bloc collectif 3 colonnes × 4 lignes, avec logo
     * fournisseur local sur chaque tuile. Même logique de signal et
     * de données que weather-block-3x4.html (Widget A) ; légèrement
     * plus grand pour rester lisible avec le logo.
     *
     * Fully self-contained — colors hardcoded here, no themes.css
     * dependency (same reasoning as the other AI Weather widgets).
     *
     * Configuration via URL only, no in-widget UI:
     *   lang=   en, fr, de, es, it, pt, nl, ru, ar, hi, ja, ko, zh
     *   theme=  light (default) | dark
     *
     * Logos are loaded from the existing local assets (./assets/<id>.png).
     * If a logo is missing for a system, that tile gracefully falls
     * back to the text-only look (logo simply not shown).
     */

    :root {
      --card-bg: #ffffff;
      --card-border: #e3e7ec;
      --tile-bg: #ffffff;
      --tile-border: #e3e7ec;
      --ink: #171b21;
      --ink-dim: #5b6270;
      --ink-faint: #9ba1ac;

      --clear: #22c55e;
      --watch: #facc15;
      --unsettled: #f97316;
      --alert: #ef4444;
    }

    [data-theme="dark"] {
      --card-bg: #1b1f26;
      --card-border: #2a2f38;
      --tile-bg: #20242c;
      --tile-border: #2a2f38;
      --ink: #f1f2f4;
      --ink-dim: #a6acb6;
      --ink-faint: #6b7280;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: transparent;
      color: var(--ink);
      font-family: "Segoe UI", "Inter", Arial, Helvetica, sans-serif;
    }

    .nm-state-msg { color: var(--ink-dim); font-size: 12px; padding: 12px; }

    .block {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px 14px 14px;
    }

    .block-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.01em;
      margin: 0 0 9px;
      padding: 0 2px;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 5px 12px;
      font-size: 10.5px;
      color: var(--ink-dim);
      margin: 0 0 11px;
      padding: 0 2px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex: 0 0 8px;
    }

    .legend-clear     { background: var(--clear); }
    .legend-watch     { background: var(--watch); }
    .legend-unsettled { background: var(--unsettled); }
    .legend-alert     { background: var(--alert); }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    @media (max-width: 340px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }

    a.tile {
      display: block;
      background: var(--tile-bg);
      border: 1px solid var(--tile-border);
      border-radius: 10px;
      padding: 8px 7px 7px;
      text-decoration: none;
      color: inherit;
      transition: box-shadow 0.15s ease, transform 0.15s ease;
    }

    a.tile:hover {
      box-shadow: 0 3px 10px rgba(15, 23, 32, 0.10);
      transform: translateY(-1px);
    }

    .tile-top {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 5px;
    }

    .tile-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex: 0 0 10px;
      border: 2px solid var(--tile-bg);
    }

    .tile.is-clear     .tile-dot { background: var(--clear);     box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.35),  0 0 9px rgba(34, 197, 94, 0.45); }
    .tile.is-watch     .tile-dot { background: var(--watch);     box-shadow: 0 0 0 1px rgba(250, 204, 21, 0.45), 0 0 9px rgba(250, 204, 21, 0.50); }
    .tile.is-unsettled .tile-dot { background: var(--unsettled); box-shadow: 0 0 0 1px rgba(249, 115, 22, 0.40), 0 0 9px rgba(249, 115, 22, 0.48); }
    .tile.is-alert     .tile-dot { background: var(--alert);     box-shadow: 0 0 0 1px rgba(239, 68, 68, 0.40),  0 0 9px rgba(239, 68, 68, 0.48); }

    .tile-name {
      flex: 1;
      min-width: 0;
      font-size: 10.5px;
      font-weight: 700;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tile-logo {
      width: 14px;
      height: 14px;
      flex: 0 0 14px;
      object-fit: contain;
      border-radius: 3px;
    }

    .tile-judgment {
      display: block;
      font-size: 8.5px;
      line-height: 1.25;
      color: var(--ink-dim);
    }

    .block-foot {
      margin-top: 13px;
      padding-top: 11px;
      border-top: 1px solid var(--card-border);
      text-align: center;
    }

    .block-foot-brand {
      font-size: 10px;
      color: var(--ink-dim);
      margin: 0 0 6px;
    }

    .block-foot-cta {
      font-size: 10px;
      font-weight: 600;
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid var(--ink-faint);
      padding-bottom: 1px;
    }

    .block-foot-cta:hover { border-bottom-color: var(--ink); }
  </style>
</head>
<body>

  <div class="block" id="block">
    <div class="nm-state-msg">Loading…</div>
  </div>

  <script src="./scripts/i18n.js"></script>
  <script src="./scripts/weather-data.js"></script>
  <!-- ControlTower widget telemetry -->
  <script src="./scripts/widget-telemetry.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const THEME = params.get("theme") === "dark" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", THEME);

    // Logo filenames live directly under ./assets/ (not ./assets/logos/)
    // and mostly match the system id. Two known exceptions:
    //  - "infomaniak" (the hosting provider) shows the NVIDIA model
    //    publicly, so its logo file is nvidia.png, not infomaniak.png.
    //  - "meta" -> the actual file on disk is capitalized (Meta.png).
    const LOGO_FILE_OVERRIDES = {
      infomaniak: "nvidia",
      meta: "Meta"
    };

    function logoTag(systemId, label) {
      const fileName = LOGO_FILE_OVERRIDES[systemId] || systemId;
      const src = `./assets/${encodeURIComponent(fileName)}.png`;
      // Graceful fallback: if the logo genuinely doesn't exist, remove
      // the <img> so the tile silently reverts to the text-only look.
      return `<img class="tile-logo" src="${src}" alt="" loading="lazy" onerror="this.remove()">`;
    }

    function tOrFallback(key, fallback) {
      const value = NMi18n.t(key);
      return value === key ? fallback : value;
    }

    function judgmentMeaning(system) {
      const judgment = system.judgment_demand || {};
      const level = judgment.level;
      if (!level) return "—";
      const key = `judgment.${level.toLowerCase()}`;
      return tOrFallback(key, judgment.meaning || "—");
    }

    Promise.all([
      NMi18n.init(),
      fetch("./config/wording.json").then(r => r.ok ? r.json() : {}).catch(() => ({})),
      NMData.load(),
      NMData.loadPanels()
    ])
      .then(([lang, wording, data, panelsConfig]) => {
        const ids = (panelsConfig.panels && panelsConfig.panels.full) || (data.systems || []).map(s => s.id);
        const systems = NMData.getPanelSystems(data, ids);
        const block = document.getElementById("block");

        if (systems.length === 0) {
          block.innerHTML = '<div class="nm-state-msg">No matching systems.</div>';
          return;
        }

        const brandName = (wording.brand && wording.brand.name) || "ControlTower";
        const fullWeatherUrl = "https://controltowerai.io/ai-weather/";

        const tilesHtml = systems.map(system => {
          const identity = NMData.getPublicIdentity(system);
          const href = `./index.html?system=${encodeURIComponent(system.id)}&lang=${encodeURIComponent(lang)}`;
          const meaning = judgmentMeaning(system);

          return `
            <a class="tile is-${system.condition}" href="${href}" target="_blank" rel="noopener"
               aria-label="${identity.label} (${identity.provider}) — ${meaning}" title="${identity.label} — ${meaning}">
              <div class="tile-top">
                <span class="tile-dot" aria-hidden="true"></span>
                <span class="tile-name">${identity.label}</span>
                ${logoTag(system.id, identity.label)}
              </div>
              <span class="tile-judgment">${meaning}</span>
            </a>
          `;
        }).join("");

        const legendHtml = `
          <span class="legend-item"><span class="legend-dot legend-clear"></span>${tOrFallback("judgment.j1", "Standard judgment")}</span>
          <span class="legend-item"><span class="legend-dot legend-watch"></span>${tOrFallback("judgment.j2", "Increased attention")}</span>
          <span class="legend-item"><span class="legend-dot legend-unsettled"></span>${tOrFallback("judgment.j3", "Heightened attention")}</span>
          <span class="legend-item"><span class="legend-dot legend-alert"></span>${tOrFallback("judgment.j4", "Critical attention")}</span>
        `;

        block.innerHTML = `
          <div class="block-title">${tOrFallback("ui.ai_weather_title", "AI Weather")}</div>
          <div class="legend">${legendHtml}</div>
          <div class="grid">${tilesHtml}</div>
          <div class="block-foot">
            <div class="block-foot-brand">${brandName} · ${tOrFallback("ui.powered_by_neomundi_runtime", "Powered by NeoMundi · Real-time AI metrology")}</div>
            <a class="block-foot-cta" href="${fullWeatherUrl}" target="_blank" rel="noopener">${tOrFallback("ui.view_full_ai_weather", "View full AI Weather →")}</a>
          </div>
        `;
      })
      .catch(() => {
        document.getElementById("block").innerHTML =
          '<div class="nm-state-msg">AI Weather data unavailable.</div>';
      });
  </script>

</body>
</html>
