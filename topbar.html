<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Weather by ControlTowerAI</title>

  <link rel="stylesheet" href="./styles/themes.css">
  <link rel="stylesheet" href="./styles/base.css">

  <style>
    html, body { width: 100%; }

    .topbar {
      display: flex;
      align-items: center;
      width: 100%;
      height: 100%;
      min-height: 64px;
      max-height: 80px;
      background: var(--nm-card-bg);
      border-bottom: 1px solid var(--nm-border);
      box-sizing: border-box;
      overflow: hidden;
    }

    .brand {
      flex: none;
      display: flex;
      align-items: center;
      height: 100%;
      padding: 0 14px;
      border-right: 1px solid var(--nm-border);
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.02em;
      white-space: nowrap;
      text-decoration: none;
      color: var(--nm-text);
    }

    .brand:hover { opacity: 0.8; }

    .providers {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 18px;
      height: 100%;
      padding: 0 16px;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      scrollbar-width: thin;
    }

    .item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      flex: none;
      text-decoration: none;
      color: var(--nm-text);
    }

    .item .dot { width: 9px; height: 9px; }

    .item .label {
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .item:hover .label { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="topbar" id="topbar">
    <div class="nm-state-msg">Loading…</div>
  </div>

  <script src="./scripts/themes.js"></script>
  <script src="./scripts/i18n.js"></script>
  <script src="./scripts/weather-data.js"></script>
  <script>
    NMThemes.init();

    Promise.all([
      NMi18n.init(),
      fetch("./config/wording.json").then(r => r.ok ? r.json() : {}).catch(() => ({})),
      NMData.load(),
      NMData.loadPanels()
    ])
      .then(([lang, config, data, panelsConfig]) => {
        const coreIds = (panelsConfig.panels && panelsConfig.panels.core) || [];
        const systems = NMData.getPanelSystems(data, coreIds);
        const links = config.links || {};
        const homeUrl = links.controltower_home || "#";
        const fullUrl = links.full_weather_url || "./index.html";

        const items = systems.map(system => {
          const identity = NMData.getPublicIdentity(system);
          const href = `${fullUrl}?system=${encodeURIComponent(system.id)}&lang=${encodeURIComponent(lang)}`;
          return `
            <a class="item" href="${href}" target="_blank" rel="noopener" aria-label="${identity.label} (${identity.provider})">
              <span class="nm-dot dot nm-condition-${system.condition}"></span>
              <span class="label">${identity.label}</span>
            </a>
          `;
        }).join("");

        document.getElementById("topbar").innerHTML = `
          <a class="brand" href="${homeUrl}" target="_blank" rel="noopener">AI Weather · ControlTowerAI</a>
          <div class="providers">${items}</div>
        `;
      })
      .catch(() => {
        document.getElementById("topbar").innerHTML =
          '<div class="nm-state-msg">AI Weather data unavailable.</div>';
      });
  </script>

</body>
</html>
