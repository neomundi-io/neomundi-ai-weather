# NeoMundi AI Weather — Observation Panel Configuration
#
# This file declares which AI systems are part of the daily observation panel.
# It is the single editable source for the panel. Nothing here is hardcoded
# in index.html or widget.html — the dashboard only ever reads weather.json,
# which is generated from this configuration plus daily measurement runs.
#
# To update the panel: edit this file, then regenerate weather.json.
# No dashboard code needs to change.
#
# System ids here match weather.json's systems[].id exactly, and are what
# config/panels.json references to build the "core" (8 providers) and
# "full" (12 systems) public views from this single dataset.
#
# Fields:
#   id             stable system id — must match weather.json systems[].id
#   provider       public provider display name
#   model_id       internal/technical identifier used by the launcher to query the system
#   runner_provider the $PROVIDER value used inside AI_WEATHER_RUNNER's run_weather_*.ps1
#                  (API-key routing layer — not always identical to `provider`,
#                  e.g. the "meta" system is queried through Together AI's API,
#                  the "infomaniak" system runs an NVIDIA model)
#   model_display  public brand name of the model, shown as the primary
#                  identity everywhere (2026-08-17 policy: model is the
#                  public identity, not the provider — e.g. "ChatGPT",
#                  not "OpenAI"). Default choice for perplexity is
#                  "Perplexity" (more recognizable than "Sonar") — change
#                  this one value if "Sonar" is preferred instead.
#   display_name   internal admin label
#   public_label   shown instead of model_id on desidentified public views
#                  (e.g. Core Panel). Set to null if the model is shown
#                  publicly (see infomaniak below).
#   enabled        set to false to exclude a system from the next observation run
#                  without deleting its configuration
#
# 2026-08-17 — updated from placeholders to the 12 real runners in
# AI_WEATHER_RUNNER\run_weather_*.ps1 (source of truth: the $PROVIDER /
# $MODEL values hardcoded in each runner). Replaced infomaniak-euria +
# system-j/k/l (4 unmatched demo placeholders) with the 4 real providers
# that had no panel entry yet: cohere, meta (Together), infomaniak (NVIDIA
# Nemotron), perplexity.

panel:
  - { id: "openai",     provider: "OpenAI",          model_id: "gpt-4o-2024-11-20", model_display: "ChatGPT",                          runner_provider: "openai",     display_name: "OpenAI",            public_label: "SYSTEM-01", enabled: true }
  - { id: "anthropic",  provider: "Anthropic",       model_id: "claude-sonnet-4-5-20250929", model_display: "Claude",                 runner_provider: "anthropic",  display_name: "Anthropic",         public_label: "SYSTEM-02", enabled: true }
  - { id: "google",     provider: "Google",          model_id: "gemini-3.6-flash", model_display: "Gemini",                           runner_provider: "google",     display_name: "Google",            public_label: "SYSTEM-03", enabled: true }
  - { id: "xai",        provider: "xAI",             model_id: "grok-4.5", model_display: "Grok",                                     runner_provider: "xai",        display_name: "xAI",               public_label: "SYSTEM-04", enabled: true }
  - { id: "mistral",    provider: "Mistral",         model_id: "mistral-medium-3-5", model_display: "Mistral",                         runner_provider: "mistral",    display_name: "Mistral",           public_label: "SYSTEM-05", enabled: true }
  - { id: "deepseek",   provider: "DeepSeek",        model_id: "deepseek-v4-pro", model_display: "DeepSeek",                          runner_provider: "deepseek",   display_name: "DeepSeek",          public_label: "SYSTEM-06", enabled: true }
  - { id: "qwen",       provider: "Qwen",            model_id: "qwen3.7-max-2026-06-08", model_display: "Qwen",                         runner_provider: "qwen",       display_name: "Qwen",              public_label: "SYSTEM-07", enabled: true }
  - { id: "moonshot",   provider: "Moonshot / Kimi", model_id: "kimi-k3", model_display: "Kimi",                                      runner_provider: "moonshot",   display_name: "Moonshot / Kimi",   public_label: "SYSTEM-08", enabled: true }
  - { id: "cohere",     provider: "Cohere",          model_id: "command-a-03-2025", model_display: "Cohere",                           runner_provider: "cohere",     display_name: "Cohere",            public_label: "SYSTEM-09", enabled: true }
  - { id: "meta",       provider: "Meta",            model_id: "meta-llama/Llama-3.3-70B-Instruct-Turbo", model_display: "Meta",        runner_provider: "together",   display_name: "Meta (via Together AI)", public_label: "SYSTEM-10", enabled: true }
  - { id: "infomaniak", provider: "Infomaniak",      model_id: "nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-FP8", model_display: "NVIDIA",     runner_provider: "infomaniak", display_name: "Infomaniak",        public_label: null,        enabled: true }
  - { id: "perplexity", provider: "Perplexity",      model_id: "sonar-reasoning-pro", model_display: "Perplexity",                      runner_provider: "perplexity", display_name: "Perplexity",         public_label: "SYSTEM-11", enabled: true }

# Protocol parameters below are DOCUMENTATION ONLY -- nothing reads them.
#
# The observation volume (how many executions per active model per day) has
# exactly one editable source of truth:
#
#   AI_WEATHER_RUNNER\config\protocol_volume.json
#
# resolved per measurement date by
# AI_WEATHER_RUNNER\lib\Get-ProtocolVolume.ps1. That config sizes both
# the generated execution panel (AI_WEATHER_RUNNER\data\panels\ai_weather_panel.csv,
# whose per-prompt `repetitions` column is what the 12 runners actually loop
# on) AND the coverage denominators used by aggregate_and_publish_weather.ps1.
# To change the volume, add an entry there -- never edit the numbers below,
# and never edit a past entry (see AI_WEATHER_KNOWN_FIXES.md #12).
#
# Volume in force since 2026-10-09 (profile WEATHER-SENTINEL-VOL-10):
#   daily (Today's Challenge)  : 3 executions / model / day
#   longitudinal (fixed probe) : 7 executions / model / day
#   total                      : 10 executions / model / day
# Before that, 2026-08-21 to 2026-10-08 (WEATHER-SENTINEL-VOL-30): 23 + 7 = 30.

protocol:
  id: "WEATHER-SENTINEL"
  version: "0.1"
  prompt_set:
    - "sentinel-02"
    - "sentinel-03"
    - "sentinel-04"
  # Informative mirror of protocol_volume.json; NOT read by any script.
  iterations_daily: 3
  iterations_longitudinal: 7
  temperature: null
