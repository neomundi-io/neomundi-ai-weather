<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeoMundi AI Weather — Widget</title>

  <style>
    /*
     * Fully self-contained widget. All colors hardcoded here — no
     * dependency on styles/themes.css or styles/base.css, so this
     * file can never break due to a missing variable defined
     * elsewhere (see 2026-08-24 incident: --nm-watch / --nm-unsettled
     * / --nm-alert / --nm-muted were missing from themes.css, so
     * every non-"clear" status silently rendered colorless).
     *
     * Configuration is 100% via URL query parameters — see
     * intégration_FR.md for the full reference. No dropdowns, no
     * in-widget UI: the embedding page decides everything up front.
     *
     *   systems=  comma-separated system ids, order respected
     *             e.g. systems=openai,anthropic,google
     *             special value: systems=global (or omitted) shows
     *             the single aggregate condition badge instead of a
     *             per-system list.
     *   lang=     en, fr, de, es, it, pt, nl, ru, ar, hi, ja, ko, zh
     *   theme=    light (default) | dark
     *   layout=   row (default, horizontal scroll)
     *             column (vertical stack)
     *             grid (wrapping grid)
     *             ignored in systems=global mode
     *   logos=    true | false (default false) — adds the official
     *             provider logo next to the status dot. The colored
     *             pulse dot is ALWAYS shown — logos are additive,
     *             never a replacement for the measured signal.
     *   logo_pos= left (default) | right | top | bottom — position of
     *             the logo relative to the name. left/right keep the
     *             pill shape (horizontal). top/bottom switch to a
     *             small vertical card. Ignored when logos=false.
     *   size=     sm | md (default) | lg
     */

    :root {
      --nm-card-bg: #ffffff;
      --nm-border: #e1e8ef;
      --nm-text: #1c2733;
      --nm-muted: #5b6b7a;
      --nm-shadow: rgba(28, 39, 51, 0.06);
      --nm-shadow-hover: rgba(28, 39, 51, 0.12);

      --nm-clear: #22c55e;
      --nm-watch: #facc15;
      --nm-unsettled: #f97316;
      --nm-alert: #ef4444;

      --dot-size: 9px;
      --dot-wrap-size: 18px;
      --logo-size: 18px;
      --font-size: 12.5px;
      --badge-pad-y: 7px;
      --badge-pad-x: 12px;
      --badge-gap: 8px;
    }

    [data-theme="dark"] {
      --nm-card-bg: #171d24;
      --nm-border: #2a333d;
      --nm-text: #eef2f6;
      --nm-muted: #97a3ae;
      --nm-shadow: rgba(0, 0, 0, 0.30);
      --nm-shadow-hover: rgba(0, 0, 0, 0.42);
    }

    [data-size="sm"] {
      --dot-size: 7px;
      --dot-wrap-size: 14px;
      --logo-size: 14px;
      --font-size: 11px;
      --badge-pad-y: 5px;
      --badge-pad-x: 9px;
      --badge-gap: 6px;
    }

    [data-size="lg"] {
      --dot-size: 11px;
      --dot-wrap-size: 22px;
      --logo-size: 22px;
      --font-size: 14px;
      --badge-pad-y: 9px;
      --badge-pad-x: 15px;
      --badge-gap: 10px;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", "Inter", Arial, Helvetica, sans-serif;
      background: transparent;
      color: var(--nm-text);
    }

    .nm-state-msg { color: var(--nm-muted); font-size: 12.5px; padding: 10px; }

    /* ---------- Shared badge (used in row / column / grid) ---------- */

    a.badge {
      display: inline-flex;
      align-items: center;
      gap: var(--badge-gap);
      flex: none;
      padding: var(--badge-pad-y) var(--badge-pad-x) var(--badge-pad-y) calc(var(--badge-pad-x) - 4px);
      border-radius: 999px;
      background: var(--nm-card-bg);
      border: 1px solid var(--nm-border);
      box-shadow: 0 1px 4px var(--nm-shadow);
      text-decoration: none;
      color: var(--nm-text);
      transition: box-shadow 0.15s ease, transform 0.15s ease;
      max-width: 100%;
    }

    a.badge:hover {
      box-shadow: 0 4px 14px var(--nm-shadow-hover);
      transform: translateY(-1px);
    }

    .dot-wrap {
      position: relative;
      width: var(--dot-wrap-size);
      height: var(--dot-wrap-size);
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dot-wrap .pulse {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.3px solid var(--ring-color, var(--nm-muted));
      animation: nm-pulse-mini 2.4s ease-out infinite;
    }

    .dot-wrap .dot {
      width: var(--dot-size);
      height: var(--dot-size);
      border-radius: 50%;
      background: var(--ring-color, var(--nm-muted));
      box-shadow: 0 0 6px var(--ring-color, transparent);
    }

    @keyframes nm-pulse-mini {
      0%   { transform: scale(0.5); opacity: 0.7; }
      75%  { transform: scale(1.8); opacity: 0; }
      100% { transform: scale(1.8); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .dot-wrap .pulse { animation: none; opacity: 0; }
    }

    .logo-img {
      width: var(--logo-size);
      height: var(--logo-size);
      flex: none;
      object-fit: contain;
      border-radius: 4px;
    }

    /* logo_pos=left / right keep the horizontal pill (default flex-row
       from a.badge above). logo_pos=top / bottom switch to a small
       vertical card instead. */
    a.badge.pos-top,
    a.badge.pos-bottom {
      flex-direction: column;
      align-items: center;
      text-align: center;
      border-radius: 14px;
      padding: 10px 12px;
      gap: 6px;
    }

    .badge .meta-row {
      display: flex;
      align-items: center;
      gap: var(--badge-gap);
    }

    .name {
      font-size: var(--font-size);
      font-weight: 700;
      letter-spacing: 0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ---------- Brand line (row / column) ---------- */

    .brand {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: var(--nm-text);
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .brand:hover { opacity: 0.85; }

    .attribution {
      font-size: 10px;
      color: var(--nm-muted);
    }

    .logo-credit {
      font-size: 9px;
      color: var(--nm-muted);
      opacity: 0.85;
    }

    /* ---------- Layout: row (horizontal scroll) ---------- */

    .layout-row {
      display: flex;
      align-items: center;
      width: 100%;
      height: 100%;
      min-height: 56px;
      background: var(--nm-card-bg);
      border-bottom: 1px solid var(--nm-border);
      overflow: hidden;
    }

    .layout-row .brand {
      flex: none;
      height: 100%;
      padding: 0 14px;
      border-right: 1px solid var(--nm-border);
    }

    .layout-row .badges {
      flex: 1;
      display: flex;
      align-items: center;
      gap: var(--badge-gap);
      height: 100%;
      padding: 0 14px;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      scrollbar-width: thin;
    }

    /* ---------- Layout: column (vertical stack) ---------- */

    .layout-column {
      width: 100%;
      max-width: 280px;
      min-width: 200px;
      box-sizing: border-box;
      padding: 14px;
      background: var(--nm-card-bg);
      border: 1px solid var(--nm-border);
      border-radius: 14px;
    }

    .layout-column .brand { margin-bottom: 12px; }

    .layout-column .badges {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .layout-column .badges a.badge { width: 100%; }

    .layout-column .attribution {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--nm-border);
    }

    /* ---------- Layout: grid (wrapping) ---------- */

    .layout-grid {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      background: var(--nm-card-bg);
      border: 1px solid var(--nm-border);
      border-radius: 14px;
    }

    .layout-grid .brand { margin-bottom: 10px; }

    .layout-grid .badges {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 8px;
    }

    .layout-grid .badges a.badge { width: 100%; }

    .layout-grid .attribution {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--nm-border);
    }

    /* ---------- Global aggregate card (systems=global / omitted) ---------- */

    .global-card {
      width: 100%;
      max-width: 380px;
      min-width: 220px;
      margin: 0 auto;
      padding: 18px;
      border: 1px solid var(--nm-border);
      border-radius: 16px;
      background: var(--nm-card-bg);
      box-shadow: 0 1px 2px var(--nm-shadow);
    }

    .global-brand {
      margin-bottom: 6px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--nm-muted);
    }

    .global-title { margin-bottom: 16px; font-size: 17px; font-weight: 700; }

    .global-status {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
      font-size: 18px;
      font-weight: 700;
    }

    .global-reading { margin-bottom: 14px; font-size: 13.5px; color: var(--nm-muted); }

    .global-scope {
      padding-top: 12px;
      border-top: 1px solid var(--nm-border);
      font-size: 12px;
      line-height: 1.5;
      color: var(--nm-muted);
    }

    .global-footer { margin-top: 10px; font-size: 10px; color: var(--nm-muted); }
  </style>
</head>
<body>

  <div id="root">
    <div class="nm-state-msg">Loading…</div>
  </div>

  <script src="./scripts/i18n.js"></script>
  <script src="./scripts/weather-data.js"></script>
  <!-- ControlTower widget telemetry -->
  <script src="./scripts/widget-telemetry.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);

    const THEME = params.get("theme") === "dark" ? "dark" : "light";
    const LAYOUT = ["row", "column", "grid"].includes(params.get("layout"))
      ? params.get("layout")
      : "row";
    const SHOW_LOGOS = params.get("logos") === "true";
    const LOGO_POS_RAW = params.get("logo_pos");
    const LOGO_POS = ["left", "right", "top", "bottom"].includes(LOGO_POS_RAW) ? LOGO_POS_RAW : "left";
    // Position only means something once a logo is actually shown.
    const EFFECTIVE_LOGO_POS = SHOW_LOGOS ? LOGO_POS : "left";
    const SIZE = ["sm", "lg"].includes(params.get("size")) ? params.get("size") : "md";
    const SYSTEMS_PARAM = params.get("systems");
    const IS_GLOBAL = !SYSTEMS_PARAM || SYSTEMS_PARAM === "global";

    document.documentElement.setAttribute("data-theme", THEME);
    document.documentElement.setAttribute("data-size", SIZE);

    function logoTag(systemId) {
      if (!SHOW_LOGOS) return "";
      return `<img class="logo-img" src="./assets/logos/${encodeURIComponent(systemId)}.png" alt="" loading="lazy" onerror="this.remove()">`;
    }

    function tOrFallback(key, fallback) {
      const value = NMi18n.t(key);
      return value === key ? fallback : value;
    }

    function renderBadgeList(data, ids) {
      const root = document.getElementById("root");
      const systems = NMData.getPanelSystems(data, ids);

      if (systems.length === 0) {
        root.innerHTML = '<div class="nm-state-msg">No matching systems.</div>';
        return;
      }

      const badgesHtml = systems.map(system => {
        const identity = NMData.getPublicIdentity(system);
        const href = `./index.html?system=${encodeURIComponent(system.id)}&lang=${encodeURIComponent(NMi18n.lang())}`;
        const ringStyle = `--ring-color: var(--nm-${system.condition}, var(--nm-muted));`;
        const ariaLabel = `${identity.label} (${identity.provider})`;
        const logo = logoTag(system.id);
        const dot = `<span class="dot-wrap"><span class="pulse"></span><span class="dot"></span></span>`;
        const name = `<span class="name">${identity.label}</span>`;

        let inner;
        if (EFFECTIVE_LOGO_POS === "right") {
          inner = `${dot}${name}${logo}`;
        } else if (EFFECTIVE_LOGO_POS === "top") {
          inner = `${logo}<span class="meta-row">${dot}${name}</span>`;
        } else if (EFFECTIVE_LOGO_POS === "bottom") {
          inner = `<span class="meta-row">${dot}${name}</span>${logo}`;
        } else {
          // left (default)
          inner = `${dot}${logo}${name}`;
        }

        return `
          <a
            class="badge pos-${EFFECTIVE_LOGO_POS}"
            href="${href}"
            target="_blank"
            rel="noopener"
            style="${ringStyle}"
            aria-label="${ariaLabel}"
            title="${identity.label}"
          >
            ${inner}
          </a>
        `;
      }).join("");

      const brandHtml = `
        <a class="brand" href="https://controltowerai.io/ai-weather/" target="_blank" rel="noopener">
          AI Weather · ControlTowerAI
        </a>
      `;

      const attributionHtml = `<div class="attribution">${NMi18n.t("ui.neomundi_measurement")}</div>`;
      const logoCreditHtml = SHOW_LOGOS
        ? `<div class="logo-credit">${tOrFallback("ui.logo_credit", "Provider logos: property of their respective owners.")}</div>`
        : "";

      if (LAYOUT === "row") {
        root.innerHTML = `
          <div class="layout-row">
            ${brandHtml}
            <div class="badges">${badgesHtml}</div>
          </div>
        `;
      } else if (LAYOUT === "column") {
        root.innerHTML = `
          <div class="layout-column">
            ${brandHtml}
            <div class="badges">${badgesHtml}</div>
            ${attributionHtml}
            ${logoCreditHtml}
          </div>
        `;
      } else {
        root.innerHTML = `
          <div class="layout-grid">
            ${brandHtml}
            <div class="badges">${badgesHtml}</div>
            ${attributionHtml}
            ${logoCreditHtml}
          </div>
        `;
      }
    }

    function renderGlobal(data, config) {
      const root = document.getElementById("root");
      const key = data.global_condition || "unknown";
      const label = NMi18n.t(`weather.${key}`);
      const reading = NMi18n.t(`interpretation.${key}`);
      const summary = data.panel_summary || {};

      root.innerHTML = `
        <div class="global-card">
          <div class="global-brand">${(config.brand && config.brand.name) || "NeoMundi"}</div>
          <div class="global-title">AI Weather</div>
          <div class="global-status">
            <span class="dot-wrap" style="--ring-color: var(--nm-${key}, var(--nm-muted));">
              <span class="pulse"></span>
              <span class="dot"></span>
            </span>
            <span>${label === `weather.${key}` ? key.toUpperCase() : label}</span>
          </div>
          <div class="global-reading">
            ${reading === `interpretation.${key}` ? "" : reading}
          </div>
          <div class="global-scope">
            ${summary.systems_count ?? "—"} ${NMi18n.t("ui.systems_observed")} ·
            ${summary.total_observations ?? "—"} ${NMi18n.t("ui.runtime_observations")}
          </div>
          <div class="global-footer">${NMi18n.t("ui.powered_by")}</div>
        </div>
      `;
    }

    Promise.all([
      NMi18n.init(),
      fetch("./config/wording.json").then(r => r.ok ? r.json() : {}).catch(() => ({})),
      NMData.load()
    ])
      .then(([lang, config, data]) => {
        if (IS_GLOBAL) {
          renderGlobal(data, config);
        } else {
          const ids = SYSTEMS_PARAM.split(",").map(s => s.trim()).filter(Boolean);
          renderBadgeList(data, ids);
        }
      })
      .catch(() => {
        document.getElementById("root").innerHTML =
          '<div class="nm-state-msg">AI Weather data unavailable.</div>';
      });
  </script>

</body>
</html>
