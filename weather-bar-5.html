<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeoMundi AI Weather — Barre 320 (5 systèmes)</title>

  <style>
    /*
     * Widget F″ — barre 320px de large, sélection à 5 systèmes
     * (Claude, ChatGPT, Grok, Kimi, Qwen). Même logique de signal, de
     * données et de tendance que le bandeau 2x6
     * (weather-bar-2x6.html) — sous-ensemble fixe de systèmes, grille
     * auto-adaptative. Format additionnel, ne remplace aucun des
     * widgets existants.
     *
     * Systems included (by publicly-shown identity):
     *   anthropic (Claude), openai (ChatGPT), xai (Grok),
     *   moonshot (Kimi), qwen (Qwen).
     *
     * Fully self-contained — colors hardcoded here, no themes.css
     * dependency (same reasoning as the other AI Weather widgets).
     * The 5 theme palettes below are copied verbatim from
     * styles/themes.css (the site's canonical source) rather than
     * reinvented.
     *
     * Configuration via URL only, no in-widget UI:
     *   lang=   en, fr, de, es, it, pt, nl, ru, ar, hi, ja, ko, zh
     *   theme=  light (default) | dark | slate | warm | transparent
     *
     * 2026-08-26: added measurement date line ("Mesuré le …" /
     * "Measured on …") between title and legend, per new fixed
     * display order: title -> date -> legend -> brand signature.
     * Date source: data.generated_at (capsule generation timestamp),
     * NOT the visitor's local clock — a widget viewed tomorrow must
     * still say "measured Aug 26", not today's date. If
     * data.generated_at is ever absent, falls back to "now" so the
     * widget never shows a blank/broken date. Brand signature moved
     * from inline-next-to-title to its own line below the strip.
     */

    :root,
    [data-theme="light"] {
      --card-bg: linear-gradient(180deg, #dceefa 0%, #edf7fc 55%, #ffffff 100%);
      --dot-ring: #ffffff;
      --card-border: #d6e2eb;
      --cell-divider: #eef2f6;
      --logo-chip-bg: #eef0f3;
      --ink: #1c2733;
      --ink-dim: #5b6b7a;
      --ink-faint: #8b97a3;

      --clear: #22c55e;
      --watch: #facc15;
      --unsettled: #f97316;
      --alert: #ef4444;
    }

    [data-theme="dark"] {
      --card-bg: linear-gradient(180deg, #101922 0%, #111820 55%, #0c1117 100%);
      --dot-ring: #0c1117;
      --card-border: #2a333d;
      --cell-divider: #232c35;
      --logo-chip-bg: #eef0f3;
      --ink: #eef2f6;
      --ink-dim: #b3bdc7;
      --ink-faint: #7f8b97;
    }

    [data-theme="slate"] {
      --card-bg: linear-gradient(180deg, #dce3e8 0%, #e9eef2 55%, #f4f6f8 100%);
      --dot-ring: #f4f6f8;
      --card-border: #d7dee5;
      --cell-divider: #e7ebef;
      --logo-chip-bg: #eef0f3;
      --ink: #1f2937;
      --ink-dim: #64748b;
      --ink-faint: #8a98a8;
    }

    [data-theme="warm"] {
      --card-bg: linear-gradient(180deg, #f2eadc 0%, #f8f2e8 55%, #fffdf8 100%);
      --dot-ring: #fffdf8;
      --card-border: #e8ddc9;
      --cell-divider: #f0e8dc;
      --logo-chip-bg: #eef0f3;
      --ink: #2b2418;
      --ink-dim: #766a56;
      --ink-faint: #9a8f7b;
    }

    [data-theme="transparent"] {
      --card-bg: transparent;
      --dot-ring: transparent;
      --card-border: rgba(23, 32, 51, 0.15);
      --cell-divider: rgba(23, 32, 51, 0.08);
      --logo-chip-bg: rgba(255, 255, 255, 0.6);
      --ink: #172033;
      --ink-dim: #6b7a89;
      --ink-faint: #8b97a3;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: transparent;
      color: var(--ink);
      font-family: "Segoe UI", "Inter", Arial, Helvetica, sans-serif;
    }

    .nm-state-msg { color: var(--ink-dim); font-size: 12px; padding: 12px; }

    .block {
      width: 320px;
      max-width: 320px;
      margin: 0 auto;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px 12px 11px;
    }

    .block-title-row {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 4px 8px;
      margin: 0 0 4px;
      padding: 0 2px;
    }

    .block-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .measured-date {
      font-size: 10.5px;
      color: var(--ink-dim);
      margin: 0 0 9px;
      padding: 0 2px;
    }

    .block-signature {
      font-size: 8.5px;
      color: var(--ink-faint);
      margin: 9px 0 0;
      padding: 0 2px;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px;
      font-size: 10px;
      color: var(--ink-dim);
      margin: 0 0 10px;
      padding: 0 2px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .legend-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex: 0 0 7px;
    }

    .legend-clear     { background: var(--clear); }
    .legend-watch     { background: var(--watch); }
    .legend-unsettled { background: var(--unsettled); }
    .legend-alert     { background: var(--alert); }

    /* Only 5 tiles instead of 12 — auto-fit lets them grow to fill
       the available width rather than sticking to a fixed column
       count designed for 12. */
    .strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
      border-top: 1px solid var(--cell-divider);
      border-left: 1px solid var(--cell-divider);
      border-radius: 10px;
      overflow: hidden;
    }

    a.cell {
      display: block;
      padding: 10px 10px 9px;
      text-decoration: none;
      color: inherit;
      border-right: 1px solid var(--cell-divider);
      border-bottom: 1px solid var(--cell-divider);
      min-width: 0;
      transition: background 0.15s ease;
    }

    a.cell:hover { background: rgba(55, 138, 221, 0.06); }

    .cell-top {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 5px;
    }

    .cell-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex: 0 0 9px;
      border: 2px solid var(--dot-ring);
    }
