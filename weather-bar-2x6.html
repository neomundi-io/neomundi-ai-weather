<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeoMundi AI Weather — Bandeau 2×6</title>

  <style>
    /*
     * Widget C — bandeau horizontal (façon Barchart top bar), 2 rangées
     * de 6 = les 12 systèmes toujours visibles, jamais de scroll.
     * Format additionnel, en plus du bloc 3×4 avec logos (Widget B) —
     * ne le remplace pas.
     *
     * Fully self-contained — colors hardcoded here, no themes.css
     * dependency (same reasoning as the other AI Weather widgets).
     * The 5 theme palettes below are copied verbatim from
     * styles/themes.css (the site's canonical source) rather than
     * reinvented.
     *
     * Configuration via URL only, no in-widget UI:
     *   lang=   en, fr, de, es, it, pt, nl, ru, ar, hi, ja, ko, zh
     *   theme=  light (default) | dark | slate | warm | transparent
     *
     * Mini trend line per tile: built from data/history/<date>.json
     * daily snapshots (system.score over the last available days).
     * The lookback window is capped at 7 calendar days and any missing
     * day is silently skipped (weekends / pipeline gaps) — the line is
     * intentionally allowed to be sparse rather than fake continuity.
     *
     * 2026-08-26: added measurement date line ("Mesuré le …" /
     * "Measured on …") between title and legend, per new fixed
     * display order: title -> date -> legend -> brand signature.
     * Date source: data.generated_at (capsule generation timestamp),
     * NOT the visitor's local clock — a widget viewed tomorrow must
     * still say "measured Aug 26", not today's date. If
     * data.generated_at is ever absent, falls back to "now" so the
     * widget never shows a blank/broken date. Brand signature moved
     * from inline-next-to-title to its own line below the strip.
     */

    :root,
    [data-theme="light"] {
      --card-bg: linear-gradient(180deg, #dceefa 0%, #edf7fc 55%, #ffffff 100%);
      --dot-ring: #ffffff;
      --card-border: #d6e2eb;
      --cell-divider: #eef2f6;
      --logo-chip-bg: #eef0f3;
      --ink: #1c2733;
      --ink-dim: #5b6b7a;
      --ink-faint: #8b97a3;

      --clear: #22c55e;
      --watch: #facc15;
      --unsettled: #f97316;
      --alert: #ef4444;
    }

    [data-theme="dark"] {
      --card-bg: linear-gradient(180deg, #101922 0%, #111820 55%, #0c1117 100%);
      --dot-ring: #0c1117;
      --card-border: #2a333d;
      --cell-divider: #232c35;
      --logo-chip-bg: #eef0f3;
      --ink: #eef2f6;
      --ink-dim: #b3bdc7;
      --ink-faint: #7f8b97;
    }

    [data-theme="slate"] {
      --card-bg: linear-gradient(180deg, #dce3e8 0%, #e9eef2 55%, #f4f6f8 100%);
      --dot-ring: #f4f6f8;
      --card-border: #d7dee5;
      --cell-divider: #e7ebef;
      --logo-chip-bg: #eef0f3;
      --ink: #1f2937;
      --ink-dim: #64748b;
      --ink-faint: #8a98a8;
    }

    [data-theme="warm"] {
      --card-bg: linear-gradient(180deg, #f2eadc 0%, #f8f2e8 55%, #fffdf8 100%);
      --dot-ring: #fffdf8;
      --card-border: #e8ddc9;
      --cell-divider: #f0e8dc;
      --logo-chip-bg: #eef0f3;
      --ink: #2b2418;
      --ink-dim: #766a56;
      --ink-faint: #9a8f7b;
    }

    [data-theme="transparent"] {
      --card-bg: transparent;
      --dot-ring: transparent;
      --card-border: rgba(23, 32, 51, 0.15);
      --cell-divider: rgba(23, 32, 51, 0.08);
      --logo-chip-bg: rgba(255, 255, 255, 0.6);
      --ink: #172033;
      --ink-dim: #6b7a89;
      --ink-faint: #8b97a3;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: transparent;
      color: var(--ink);
      font-family: "Segoe UI", "Inter", Arial, Helvetica, sans-serif;
    }

    .nm-state-msg { color: var(--ink-dim); font-size: 12px; padding: 12px; }

    .block {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px 12px 11px;
    }

    .block-title-row {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 4px 8px;
      margin: 0 0 4px;
      padding: 0 2px;
    }

    .block-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .measured-date {
      font-size: 10.5px;
      color: var(--ink-dim);
      margin: 0 0 9px;
      padding: 0 2px;
    }

    .block-signature {
      font-size: 8.5px;
      color: var(--ink-faint);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin: 9px 0 0;
      padding: 0 2px;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px;
      font-size: 10px;
      color: var(--ink-dim);
      margin: 0 0 10px;
      padding: 0 2px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .legend-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex: 0 0 7px;
    }

    .legend-clear     { background: var(--clear); }
    .legend-watch     { background: var(--watch); }
    .legend-unsettled { background: var(--unsettled); }
    .legend-alert     { background: var(--alert); }

    .strip {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      border-top: 1px solid var(--cell-divider);
      border-left: 1px solid var(--cell-divider);
      border-radius: 10px;
      overflow: hidden;
    }

    @media (min-width: 360px) {
      .strip { grid-template-columns: repeat(3, 1fr); }
    }

    @media (min-width: 620px) {
      .strip { grid-template-columns: repeat(6, 1fr); }
    }

    a.cell {
      display: block;
      padding: 8px 8px 7px 9px;
      text-decoration: none;
      color: inherit;
      border-right: 1px solid var(--cell-divider);
      border-bottom: 1px solid var(--cell-divider);
      min-width: 0;
      transition: background 0.15s ease;
    }

    a.cell:hover { background: rgba(55, 138, 221, 0.06); }

    .cell-top {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 4px;
    }

    .cell-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex: 0 0 8px;
      border: 2px solid var(--dot-ring);
    }

    .cell.is-clear     .cell-dot { background: var(--clear);     box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.35),  0 0 7px rgba(34, 197, 94, 0.45); }
    .cell.is-watch     .cell-dot { background: var(--watch);     box-shadow: 0 0 0 1px rgba(250, 204, 21, 0.45), 0 0 7px rgba(250, 204, 21, 0.50); }
    .cell.is-unsettled .cell-dot { background: var(--unsettled); box-shadow: 0 0 0 1px rgba(249, 115, 22, 0.40), 0 0 7px rgba(249, 115, 22, 0.48); }
    .cell.is-alert     .cell-dot { background: var(--alert);     box-shadow: 0 0 0 1px rgba(239, 68, 68, 0.40),  0 0 7px rgba(239, 68, 68, 0.48); }

    .cell-name {
      flex: 1;
      min-width: 0;
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cell-logo-wrap {
      width: 13px;
      height: 13px;
      flex: 0 0 13px;
      background: var(--logo-chip-bg);
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1px;
    }

    .cell-logo { width: 100%; height: 100%; object-fit: contain; }

    .cell-spark {
      width: 100%;
      height: 13px;
      display: block;
    }
  </style>
</head>
<body>

  <div class="block" id="block">
    <div class="nm-state-msg">Loading…</div>
  </div>

  <script src="./scripts/i18n.js"></script>
  <script src="./scripts/weather-data.js"></script>
  <!-- ControlTower widget telemetry -->
  <script src="./scripts/widget-telemetry.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const AVAILABLE_THEMES = ["light", "dark", "slate", "warm", "transparent"];
    const THEME_PARAM = (params.get("theme") || "").toLowerCase();
    const THEME = AVAILABLE_THEMES.includes(THEME_PARAM) ? THEME_PARAM : "light";
    document.documentElement.setAttribute("data-theme", THEME);

    // Logo filenames live directly under ./assets/ (not ./assets/logos/)
    // and mostly match the system id. Two known exceptions:
    //  - "infomaniak" (the hosting provider) shows the NVIDIA model
    //    publicly, so its logo file is nvidia.png, not infomaniak.png.
    //  - "meta" -> the actual file on disk is capitalized (Meta.png).
    const LOGO_FILE_OVERRIDES = {
      infomaniak: "nvidia",
      meta: "Meta"
    };

    function logoTag(systemId) {
      const fileName = LOGO_FILE_OVERRIDES[systemId] || systemId;
      const src = `./assets/${encodeURIComponent(fileName)}.png`;
      return `<span class="cell-logo-wrap"><img class="cell-logo" src="${src}" alt="" loading="lazy" onerror="this.closest('.cell-logo-wrap').remove()"></span>`;
    }

    function tOrFallback(key, fallback) {
      const value = NMi18n.t(key);
      return value === key ? fallback : value;
    }

    // Same short, per-language hover CTA used on the 3x4 logo block —
    // kept identical across widgets for consistency.
    const TILE_CTA = {
      en: "See the AI Weather",
      fr: "Voir la météo des IA",
      de: "KI-Wetter ansehen",
      es: "Ver el clima de las IA",
      it: "Vedi il meteo delle IA",
      pt: "Ver o clima das IAs",
      nl: "Bekijk het AI-weer",
      ru: "Смотреть погоду ИИ",
      ar: "عرض طقس الذكاء الاصطناعي",
      hi: "एआई मौसम देखें",
      ja: "AIの天気を見る",
      ko: "AI 날씨 보기",
      zh: "查看AI天气"
    };

    // "Measured on" / "Mesuré le" prefix, localized, followed by the
    // capsule date formatted via toLocaleDateString(lang, ...) below.
    const MEASURED_PREFIX = {
      en: "Measured on",
      fr: "Mesuré le",
      de: "Gemessen am",
      es: "Medido el",
      it: "Misurato il",
      pt: "Medido em",
      nl: "Gemeten op",
      ru: "Измерено",
      ar: "قِيس في",
      hi: "मापा गया",
      ja: "測定日",
      ko: "측정일",
      zh: "测量日期"
    };

    // Brand signature: moved off the title row (2026-08-26), sits on
    // its own line under the strip now. English-only regardless of
    // ?lang= — same product decision as the other AI Weather widgets.
    const BRAND_SIGNATURE = "Powered by NeoMundi · Real-time AI metrology for governance";

    const CONDITION_VAR = {
      clear: "--clear",
      watch: "--watch",
      unsettled: "--unsettled",
      alert: "--alert"
    };

    function pad2(n) { return String(n).padStart(2, "0"); }
    function dateStr(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }

    // Measurement date shown to the visitor: the capsule's own
    // generated_at timestamp, NOT the visitor's local "now". Falls
    // back to "now" only if the field is ever missing, so the widget
    // never shows a blank line.
    function formatMeasuredDate(data, lang) {
      const raw = data && data.generated_at;
      const d = raw ? new Date(raw) : new Date();
      const prefix = MEASURED_PREFIX[lang] || MEASURED_PREFIX.en;
      const dateText = d.toLocaleDateString(lang, { day: "numeric", month: "long" });
      return `${prefix} ${dateText}`;
    }

    // Best-effort trend data: try the last 7 calendar days of
    // data/history/<date>.json, keep whichever exist, skip the rest.
    // Missing days (weekends, pipeline gaps) are not backfilled —
    // a sparse line is preferred over a fabricated one.
    function loadHistoryScores(systemIds) {
      const days = [];
      const today = new Date();
      for (let i = 0; i < 7; i++) {
        const d = new Date(today);
        d.setDate(d.getDate() - i);
        days.push(dateStr(d));
      }

      return Promise.allSettled(
        days.map(day =>
          fetch(`./data/history/${day}.json`).then(r => (r.ok ? r.json() : Promise.reject()))
        )
      ).then(results => {
        const snapshots = results
          .filter(r => r.status === "fulfilled" && r.value && Array.isArray(r.value.systems))
          .map(r => r.value);

        snapshots.sort((a, b) => new Date(a.generated_at || 0) - new Date(b.generated_at || 0));

        const scoresBySystem = {};
        systemIds.forEach(id => { scoresBySystem[id] = []; });

        snapshots.forEach(snap => {
          (snap.systems || []).forEach(s => {
            if (scoresBySystem[s.id] && typeof s.score === "number") {
              scoresBySystem[s.id].push(s.score);
            }
          });
        });

        return scoresBySystem;
      });
    }

    function sparklineSvg(scores, conditionVarName) {
      if (!scores || scores.length < 2) return "";

      const w = 56, h = 13, pad = 2;
      const min = Math.min(...scores);
      const max = Math.max(...scores);
      const range = max - min || 1;
      const stepX = (w - pad * 2) / (scores.length - 1);

      const points = scores.map((v, i) => {
        const x = pad + i * stepX;
        const y = h - pad - ((v - min) / range) * (h - pad * 2);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(" ");

      return `<svg class="cell-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
        <polyline points="${points}" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
          style="stroke: var(${conditionVarName});"></polyline>
      </svg>`;
    }

    Promise.all([
      NMi18n.init(),
      fetch("./config/wording.json").then(r => r.ok ? r.json() : {}).catch(() => ({})),
      NMData.load(),
      NMData.loadPanels()
    ])
      .then(([lang, wording, data, panelsConfig]) => {
        const ids = (panelsConfig.panels && panelsConfig.panels.full) || (data.systems || []).map(s => s.id);
        const systems = NMData.getPanelSystems(data, ids);
        const block = document.getElementById("block");

        if (systems.length === 0) {
          block.innerHTML = '<div class="nm-state-msg">No matching systems.</div>';
          return;
        }

        const brandName = (wording.brand && wording.brand.name) || "ControlTower";
        const fullWeatherUrl = "https://controltowerai.io/ai-weather/";
        const tileCta = TILE_CTA[lang] || TILE_CTA.en;
        const measuredDateText = formatMeasuredDate(data, lang);

        loadHistoryScores(ids)
          .catch(() => ({}))
          .then(scoresBySystem => {
            const cellsHtml = systems.map(system => {
              const identity = NMData.getPublicIdentity(system);
              const conditionVar = CONDITION_VAR[system.condition] || "--ink-faint";
              const scores = (scoresBySystem && scoresBySystem[system.id]) || [];

              return `
                <a class="cell is-${system.condition}" href="${fullWeatherUrl}" target="_blank" rel="noopener"
                   aria-label="${identity.label} — ${tileCta}" title="${tileCta}">
                  <div class="cell-top">
                    <span class="cell-dot" aria-hidden="true"></span>
                    <span class="cell-name">${identity.label}</span>
                    ${logoTag(system.id)}
                  </div>
                  ${sparklineSvg(scores, conditionVar)}
                </a>
              `;
            }).join("");

            const legendHtml = `
              <span class="legend-item"><span class="legend-dot legend-clear"></span>${tOrFallback("judgment.j1", "Standard judgment")}</span>
              <span class="legend-item"><span class="legend-dot legend-watch"></span>${tOrFallback("judgment.j2", "Increased attention")}</span>
              <span class="legend-item"><span class="legend-dot legend-unsettled"></span>${tOrFallback("judgment.j3", "Heightened attention")}</span>
              <span class="legend-item"><span class="legend-dot legend-alert"></span>${tOrFallback("judgment.j4", "Critical attention")}</span>
            `;

            block.innerHTML = `
              <div class="block-title-row">
                <span
