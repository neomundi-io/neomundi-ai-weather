<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeoMundi AI Weather — Wall Widget</title>

  <style>
    /*
     * Reuses the exact card visual language of index.html (the Wall):
     * rounded card, colored dot, provider name, judgment meaning text.
     * Self-contained — colors hardcoded here, no themes.css dependency
     * (same reasoning as weather-widget.html: never break due to a
     * variable missing in a shared file).
     *
     * Configuration via URL only, no in-widget UI:
     *   systems=   comma-separated ids, order respected.
     *              Omitted → shows the full 12-system panel.
     *              A single id → one card (the "individual" format).
     *   lang=      en, fr, de, es, it, pt, nl, ru, ar, hi, ja, ko, zh
     *   theme=     light (default) | dark
     *   legend=    true (default) | false — show the 4-state legend
     *   brand=     true (default) | false — show the top brand line
     */

    :root {
      --sky-top: #dceefa;
      --sky-mid: #edf7fc;
      --sky-bottom: #ffffff;
      --card-bg: #ffffff;
      --card-border: #d6e2eb;
      --ink: #1c2733;
      --ink-dim: #5b6b7a;
      --ink-faint: #8b97a3;
      --accent: #378ADD;
    }

    [data-theme="dark"] {
      --sky-top: #101922;
      --sky-mid: #111820;
      --sky-bottom: #0c1117;
      --card-bg: #171d24;
      --card-border: #2a333d;
      --ink: #eef2f6;
      --ink-dim: #b3bdc7;
      --ink-faint: #7f8b97;
      --accent: #62a9e8;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--sky-bottom);
      color: var(--ink);
      font-family: "Segoe UI", "Inter", Arial, Helvetica, sans-serif;
    }

    .container {
      padding: 14px;
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .brand {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-decoration: none;
      color: var(--ink);
    }

    .brand:hover { opacity: 0.85; }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      font-size: 11px;
      color: var(--ink-dim);
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .legend-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex: 0 0 9px;
      border: 1.5px solid var(--card-bg);
      box-shadow: 0 0 0 1px rgba(28, 39, 51, 0.10);
    }

    .legend-green  { background: #22c55e; }
    .legend-yellow { background: #facc15; }
    .legend-orange { background: #f97316; }
    .legend-red    { background: #ef4444; }

    .nm-state-msg { color: var(--ink-dim); font-size: 13px; }

    /* ---------- Grid / cards — identical language to index.html ---------- */

    .wall {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    @media (max-width: 340px) {
      .wall { grid-template-columns: 1fr; }
    }

    @media (min-width: 560px) {
      .wall { grid-template-columns: repeat(3, 1fr); }
    }

    @media (min-width: 860px) {
      .wall { grid-template-columns: repeat(4, 1fr); }
    }

    a.card {
      display: block;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-left: 4px solid var(--ink-faint);
      border-radius: 14px;
      padding: 13px;
      text-align: left;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 4px 14px rgba(45, 75, 95, 0.06);
      transition: box-shadow 0.15s ease, transform 0.15s ease;
    }

    a.card:hover {
      box-shadow: 0 6px 18px rgba(45, 75, 95, 0.09);
      transform: translateY(-1px);
    }

    a.card.is-clear     { border-left-color: #2ecc71; }
    a.card.is-watch     { border-left-color: #f1c40f; }
    a.card.is-unsettled { border-left-color: #f39c12; }
    a.card.is-alert     { border-left-color: #e74c3c; }

    .card-state-line {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 9px;
      min-height: 24px;
    }

    .card-state-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      flex: 0 0 20px;
      border: 3px solid var(--card-bg);
      box-shadow:
        0 0 0 1px rgba(28, 39, 51, 0.12),
        0 3px 10px rgba(28, 39, 51, 0.14);
    }

    .is-clear .card-state-dot {
      background: #22c55e;
      box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.35), 0 0 14px rgba(34, 197, 94, 0.45);
    }
    .is-watch .card-state-dot {
      background: #facc15;
      box-shadow: 0 0 0 1px rgba(250, 204, 21, 0.45), 0 0 14px rgba(250, 204, 21, 0.50);
    }
    .is-unsettled .card-state-dot {
      background: #f97316;
      box-shadow: 0 0 0 1px rgba(249, 115, 22, 0.40), 0 0 14px rgba(249, 115, 22, 0.48);
    }
    .is-alert .card-state-dot {
      background: #ef4444;
      box-shadow: 0 0 0 1px rgba(239, 68, 68, 0.40), 0 0 14px rgba(239, 68, 68, 0.48);
    }

    .card-model {
      font-size: 13.5px;
      font-weight: 700;
      line-height: 1.35;
      color: var(--ink);
      margin: 0;
    }

    .card-judgment {
      font-size: 12px;
      line-height: 1.4;
      color: var(--ink-dim);
    }

    /* ---------- Single-card (individual) mode ---------- */

    .wall.single-mode {
      display: block;
    }

    .wall.single-mode a.card {
      max-width: 340px;
    }

    .attribution {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--card-border);
      font-size: 10.5px;
      color: var(--ink-faint);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-row">
      <a class="brand" id="brand-link" href="https://controltowerai.io/ai-weather/" target="_blank" rel="noopener">AI Weather · ControlTowerAI</a>
      <div class="legend" id="legend"></div>
    </div>

    <div class="wall" id="wall">
      <div class="nm-state-msg">Loading…</div>
    </div>

    <div class="attribution" id="attribution"></div>
  </div>

  <script src="./scripts/i18n.js"></script>
  <script src="./scripts/weather-data.js"></script>
  <!-- ControlTower widget telemetry -->
  <script src="./scripts/widget-telemetry.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const THEME = params.get("theme") === "dark" ? "dark" : "light";
    const SHOW_LEGEND = params.get("legend") !== "false";
    const SHOW_BRAND = params.get("brand") !== "false";
    const SYSTEMS_PARAM = params.get("systems");

    document.documentElement.setAttribute("data-theme", THEME);
    document.getElementById("brand-link").style.display = SHOW_BRAND ? "" : "none";

    function tOrFallback(key, fallback) {
      const value = NMi18n.t(key);
      return value === key ? fallback : value;
    }

    function judgmentMeaning(system) {
      const judgment = system.judgment_demand || {};
      const level = judgment.level;
      if (!level) return "—";
      const key = `judgment.${level.toLowerCase()}`;
      return tOrFallback(key, judgment.meaning || "—");
    }

    Promise.all([
      NMi18n.init(),
      NMData.load(),
      NMData.loadPanels()
    ])
      .then(([lang, data, panelsConfig]) => {
        const ids = SYSTEMS_PARAM
          ? SYSTEMS_PARAM.split(",").map(s => s.trim()).filter(Boolean)
          : (panelsConfig.panels && panelsConfig.panels.full) || (data.systems || []).map(s => s.id);

        const systems = NMData.getPanelSystems(data, ids);
        const wall = document.getElementById("wall");

        if (systems.length === 0) {
          wall.innerHTML = '<div class="nm-state-msg">No matching systems.</div>';
          return;
        }

        if (systems.length === 1) {
          wall.classList.add("single-mode");
        }

        wall.innerHTML = systems.map(system => {
          const identity = NMData.getPublicIdentity(system);
          const href = `./index.html?system=${encodeURIComponent(system.id)}&lang=${encodeURIComponent(lang)}`;
          const meaning = judgmentMeaning(system);

          return `
            <a class="card is-${system.condition}" href="${href}" target="_blank" rel="noopener"
               aria-label="${identity.label} — ${meaning}">
              <div class="card-state-line">
                <span class="card-state-dot" aria-hidden="true"></span>
                <div class="card-model">${identity.label}</div>
              </div>
              <div class="card-judgment">${meaning}</div>
            </a>
          `;
        }).join("");

        if (SHOW_LEGEND) {
          document.getElementById("legend").innerHTML = `
            <span class="legend-item"><span class="legend-dot legend-green"></span>${tOrFallback("judgment.j1", "Standard judgment")}</span>
            <span class="legend-item"><span class="legend-dot legend-yellow"></span>${tOrFallback("judgment.j2", "Increased attention")}</span>
            <span class="legend-item"><span class="legend-dot legend-orange"></span>${tOrFallback("judgment.j3", "Heightened attention")}</span>
            <span class="legend-item"><span class="legend-dot legend-red"></span>${tOrFallback("judgment.j4", "Critical attention")}</span>
          `;
        }

        document.getElementById("attribution").textContent =
          tOrFallback("ui.card_footer", "ControlTower · Powered by NeoMundi · Real-time AI metrology and independent observatory.");
      })
      .catch(() => {
        document.getElementById("wall").innerHTML =
          '<div class="nm-state-msg">AI Weather data unavailable.</div>';
      });
  </script>

</body>
</html>
