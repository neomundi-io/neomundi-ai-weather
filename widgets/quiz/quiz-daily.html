<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Question of the Day — NeoMundi AI Weather</title>
<!-- See quiz-full.html's header comment: <base> makes this page's
     relative URLs — including scripts/i18n.js's own internal fetches —
     resolve as if served from the repo root, without touching that
     shared module. -->
<base href="../../">
<link rel="stylesheet" href="widgets/quiz/quiz.css">
</head>
<body>

<!--
  quiz-daily — "signal du jour", one real question drawn from today's
  quiz-data/daily-drift.json (Step 3).

  Role match: this page only exists embedded inside the daily weather
  widget/page, never as a standalone destination someone shares a link
  to directly. Per the 2026-08-30 product decision, it follows the
  SAME convention as every other embeddable AI Weather widget
  (weather-bar-*.html, weather-sidebar-*.html): "configuration via URL
  only, no in-widget UI" — ?lang= param + browser detection, no
  visible language selector. quiz-full.html is the one with the
  selector; see that file's header comment.

  All rendering logic lives in quiz-engine.js.
-->

<div class="quiz-wrap">
  <div class="quiz" id="quiz">
    <div class="quiz-loading">Loading…</div>
  </div>
</div>

<script src="scripts/i18n.js"></script>
<script src="widgets/quiz/quiz-engine.js"></script>
<script src="scripts/quiz-telemetry.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  document.documentElement.setAttribute("data-theme", params.get("theme") === "dark" ? "dark" : "light");

  NMi18n.init().then(() => {
    NMQuiz.initQuizDaily(document.getElementById("quiz"), {
      onEvent: (name, payload) => NMQuizTelemetry.track(name, payload),
    });
  });
</script>

</body>
</html>
