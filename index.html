<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#eaf4fb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AI Weather">
  <link rel="manifest" href="./manifest.json">

  <!-- Favicon set — ControlTower logo, white mark on brand blue (#378ADD) -->
  <link rel="icon" href="./assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="./assets/favicon-48.png">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">

  <link rel="stylesheet" href="./styles/themes.css">

  <title>NeoMundi AI Weather — Observation Wall</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      --sky-top: var(--nm-bg-top);
      --sky-mid: var(--nm-bg-mid);
      --sky-bottom: var(--nm-bg-bottom);
      --card-bg: var(--nm-card-bg);
      --card-border: var(--nm-border);
      --ink: var(--nm-text);
      --ink-dim: var(--nm-text-dim);
      --ink-faint: var(--nm-text-faint);
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-bottom) 100%) no-repeat;
      background-size: 100% 640px;
      background-color: var(--sky-bottom);
      color: var(--ink);
      font-family: "Segoe UI", "Inter", Arial, Helvetica, sans-serif;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: calc(18px + env(safe-area-inset-top)) 18px 48px;
    }

    /* ---------- Header ---------- */

    header {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .logo {
      flex: none;
      width: 72px;
      height: 72px;
      padding: 8px;
      border-radius: 50%;
      background: #ffffff;
      border: 1px solid rgba(23, 32, 51, 0.12);
      box-shadow: 0 4px 14px rgba(23, 32, 51, 0.10);
    }

    .logo img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    .header-text { flex: 1; min-width: 220px; }

    .header-brand {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: #9aa7b2;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 25px;
      font-weight: 700;
      color: var(--ink);
      margin: 0 0 5px 0;
      line-height: 1.28;
    }

    .title-date {
      font-weight: 400;
      color: var(--ink-dim);
    }

    .header-date {
      font-size: 13px;
      color: var(--ink-dim);
      margin-bottom: 8px;
    }

    .header-subtitle {
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--ink-dim);
      max-width: 520px;
    }

    @media (max-width: 560px) {
      .logo {
        width: 64px;
        height: 64px;
      }

    }

    .methodology-link {
      display: inline-block;
      margin-top: 10px;
      font-size: 12.5px;
      font-weight: 600;
      color: #378ADD;
      text-decoration: none;
    }

    .methodology-link:hover { text-decoration: underline; }

    /* ---------- Header controls ---------- */

    .header-controls {
      flex: none;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-left: auto;
    }

    .theme-select,
    .lang-select {
      position: relative;
    }

    .theme-button,
    .lang-button {
      appearance: none;
      -webkit-appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      padding: 6px 10px;
      background: var(--nm-card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--ink-dim);
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 2px 8px var(--nm-shadow-soft);
    }

    .theme-button:hover,
    .lang-button:hover,
    .theme-button:focus-visible,
    .lang-button:focus-visible {
      color: var(--ink);
      border-color: var(--ink-faint);
      outline: none;
    }

    .theme-menu,
    .lang-menu {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      min-width: 150px;
      max-height: min(360px, 70vh);
      overflow-y: auto;
      padding: 5px;
      background: var(--nm-card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      box-shadow: 0 10px 28px var(--nm-shadow-medium);
      z-index: 1000;
    }

    .theme-menu.open,
    .lang-menu.open {
      display: block;
    }

    .theme-option,
    .lang-option {
      appearance: none;
      -webkit-appearance: none;
      display: block;
      width: 100%;
      padding: 9px 10px;
      background: transparent;
      border: 0;
      border-radius: 7px;
      color: var(--ink);
      font: inherit;
      font-size: 12.5px;
      text-align: left;
      cursor: pointer;
      white-space: nowrap;
    }

    .theme-option:hover,
    .lang-option:hover,
    .theme-option:focus-visible,
    .lang-option:focus-visible {
      background: var(--nm-menu-hover);
      outline: none;
    }

    .theme-option.active,
    .lang-option.active {
      background: var(--nm-surface-soft);
      font-weight: 800;
    }

    @media (max-width: 760px) {
      header {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 12px;
      }

      .header-text {
        min-width: 0;
      }

      .header-controls {
        grid-column: 3;
        grid-row: 1;
        align-self: start;
        gap: 6px;
      }

      .theme-button,
      .lang-button {
        min-height: 30px;
        padding: 5px 8px;
        font-size: 11.5px;
      }

      .theme-menu,
      .lang-menu {
        min-width: 140px;
      }
    }

    @media (max-width: 520px) {
      header {
        grid-template-columns: 64px 1fr;
      }

      .logo {
        grid-column: 1;
        grid-row: 1;
      }

      .header-text {
        grid-column: 2;
        grid-row: 1;
      }

      .header-controls {
        grid-column: 1 / -1;
        grid-row: 2;
        width: 100%;
        justify-content: flex-end;
        margin-top: 2px;
      }
    }

    .demo-flag {
      display: inline-block;
      margin: 12px 0 20px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: #7a5200;
      background: #fdf0da;
      border: 1px solid #f0dcb0;
      padding: 4px 10px;
      border-radius: 999px;
    }

    /* ---------- Wall ---------- */

    .wall-heading {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin: 0 0 12px;
    }

    .wall-intro {
      margin-bottom: 12px;
    }

    .wall-heading-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 8px;
      min-height: 18px;
    }

    .wall-heading-row .wall-heading {
      display: none;
    }

    .wall-legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 7px 14px;
      max-width: 720px;
      font-size: 11.5px;
      line-height: 1.35;
      color: var(--ink-dim);
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex: 0 0 10px;
      border: 1.5px solid #ffffff;
      box-shadow: 0 0 0 1px rgba(28, 39, 51, 0.10);
    }

    .legend-green  { background: #22c55e; }
    .legend-yellow { background: #facc15; }
    .legend-orange { background: #fb923c; }
    .legend-red    { background: #b91c1c; }

    .daily-question-section {
      margin-top: 18px;
    }

    .daily-question {
      position: relative;
      overflow: hidden;
      background: var(--nm-card-bg-soft);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 11px 16px 12px;
      box-shadow: 0 4px 16px rgba(45, 75, 95, 0.05);
    }

    .daily-question::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 4px;
      background: #378ADD;
    }

    .daily-question-label {
      margin-bottom: 4px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }

    .daily-question-text {
      max-width: 980px;
      font-size: 13.5px;
      line-height: 1.45;
      font-weight: 600;
      color: var(--ink);
    }

    .daily-question-original {
      margin-top: 10px;
      padding-top: 9px;
      border-top: 1px solid var(--nm-border-soft);
    }

    .daily-question-original summary {
      display: inline-block;
      cursor: pointer;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--ink-faint);
      user-select: none;
      list-style: none;
    }

    .daily-question-original summary::-webkit-details-marker {
      display: none;
    }

    .daily-question-original summary::after {
      content: " ▾";
    }

    .daily-question-original[open] summary::after {
      content: " ▴";
    }

    .daily-question-original-label {
      margin-top: 9px;
      margin-bottom: 4px;
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }

    .daily-question-original-text {
      font-size: 11.5px;
      line-height: 1.45;
      color: var(--ink-faint);
    }

    @media (max-width: 760px) {
      .wall-heading-row {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 7px;
      }

      .wall-legend {
        justify-content: flex-start;
        max-width: none;
      }
    }

    .wall {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    @media (max-width: 340px) {
      .wall { grid-template-columns: 1fr; }
    }

    @media (min-width: 560px) {
      .wall { grid-template-columns: repeat(3, 1fr); }
    }

    @media (min-width: 860px) {
      .wall { grid-template-columns: repeat(4, 1fr); }
    }

    @media (max-width: 559px) {
      .container {
        padding-left: 12px;
        padding-right: 12px;
      }

      .wall {
        gap: 8px;
      }

      .card {
        padding: 11px 10px;
      }

      .card-state-line {
        gap: 8px;
        margin-bottom: 7px;
      }

      .card-model {
        font-size: 12px;
      }

      .daily-question {
        padding: 10px 12px 11px;
      }

      .daily-question-text {
        font-size: 12.5px;
      }

      .daily-question-section {
        margin-top: 12px;
      }

      .daily-question-original-text {
        font-size: 11px;
      }

      .wall-legend {
        justify-content: flex-start;
        gap: 5px 10px;
        font-size: 10.5px;
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-left: 4px solid var(--ink-faint);
      border-radius: 14px;
      padding: 13px 13px;
      text-align: left;
      box-shadow: 0 4px 14px rgba(45, 75, 95, 0.06);
      width: 100%;
    }

    .card.is-clear {
      border-left-color: #2ecc71;
    }

    .card.is-watch {
      border-left-color: #f1c40f;
    }

    .card.is-unsettled {
      border-left-color: #fb923c;
    }

    .card.is-alert {
      border-left-color: #b91c1c;
    }

    .card.deep-linked {
      outline: 2px solid #378ADD;
      outline-offset: 2px;
    }

    /* Wall v0.3 — the state is communicated by color only.
       No duplicated CLEAR/WATCH/STABLE text on the 12-card wall. */
    .card-state-line {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 9px;
      min-height: 24px;
    }

    .card-state-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      flex: 0 0 20px;
      border: 3px solid #ffffff;
      box-shadow:
        0 0 0 1px rgba(28, 39, 51, 0.12),
        0 3px 10px rgba(28, 39, 51, 0.14);
    }

    .is-clear .card-state-dot {
      background: #22c55e;
      box-shadow:
        0 0 0 1px rgba(34, 197, 94, 0.35),
        0 0 14px rgba(34, 197, 94, 0.45);
    }

    .is-watch .card-state-dot {
      background: #facc15;
      box-shadow:
        0 0 0 1px rgba(250, 204, 21, 0.45),
        0 0 14px rgba(250, 204, 21, 0.50);
    }

    .is-unsettled .card-state-dot {
      background: #fb923c;
      box-shadow:
        0 0 0 1px rgba(251, 146, 60, 0.40),
        0 0 14px rgba(251, 146, 60, 0.48);
    }

    .is-alert .card-state-dot {
      background: #b91c1c;
      box-shadow:
        0 0 0 1px rgba(185, 28, 28, 0.40),
        0 0 14px rgba(185, 28, 28, 0.48);
    }

    .card-model {
      font-size: 13.5px;
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: 0.01em;
      color: var(--ink);
      overflow-wrap: anywhere;
      margin: 0;
    }

    .card-sparkline {
      display: block;
      width: 100%;
      height: 28px;
    }

    .card-sparkline-point-insufficient {
      fill: var(--ink-faint);
    }

    /* ---------- Footer ---------- */

    footer {
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid var(--card-border);
    }

    .footer-signature {
      margin-top: 6px;
      font-size: 11px;
      line-height: 1.5;
      color: var(--ink-faint);
    }

    .footer-signature strong {
      font-weight: 700;
      color: var(--ink-dim);
    }

    .state-msg { color: var(--ink-dim); font-size: 14px; }
  </style>

  <!-- ============================================================
       SKIN OVERRIDE — Démo 1 : "Éditorial"
       Pure surcouche CSS. N'écrase ni les tokens de thème (--nm-*),
       ni la logique JS, ni les i18n. Sans-serif partout.
       ============================================================ -->
  <style id="skin-editorial">
    body { font-family: "Segoe UI", Inter, Arial, Helvetica, sans-serif; }

    h1 { font-weight: 800; letter-spacing: -0.015em; }

    .header-brand { font-weight: 700; letter-spacing: 0.16em; }

    /* Cards: stronger left-accent bar, flatter, tighter radius */
    .card {
      border-left-width: 6px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(28, 39, 51, 0.05);
    }
    .card-model { font-weight: 800; letter-spacing: 0; }

    footer { padding-top: 20px; }
  </style>
</head>

<body>

  <main class="container">

    <header>
      <div class="logo"><img src="./assets/logo-controltower.png" alt="ControlTower logo"></div>
      <div class="header-text">
        <div class="header-brand" id="brand-label">CONTROLTOWER</div>
        <h1 id="title">AI Weather</h1>
      </div>

      <div class="header-controls">
        <div class="lang-select">
          <button class="lang-button" id="lang-button" type="button" aria-haspopup="true" aria-expanded="false">EN ▾</button>
          <div class="lang-menu" id="lang-menu"></div>
        </div>

        <div class="theme-select">
          <button class="theme-button" id="theme-button" type="button" aria-haspopup="true" aria-expanded="false">Theme ▾</button>
          <div class="theme-menu" id="theme-menu">
            <button class="theme-option" data-theme="light" type="button">Light</button>
            <button class="theme-option" data-theme="dark" type="button">Dark</button>
            <button class="theme-option" data-theme="slate" type="button">Slate</button>
            <button class="theme-option" data-theme="warm" type="button">Warm</button>
            <button class="theme-option" data-theme="transparent" type="button">Transparent</button>
          </div>
        </div>
      </div>
    </header>

    <div id="demo-flag-holder"></div>

    <section class="wall-intro" aria-label="AI Weather observation wall">
      <div class="wall-heading-row">
        <div class="wall-legend" id="wall-legend" aria-label="AI Weather legend">
          <div class="legend-item">
            <span class="legend-dot legend-green" aria-hidden="true"></span>
            <span id="legend-green-label">Normal</span>
          </div>
          <div class="legend-item">
            <span class="legend-dot legend-yellow" aria-hidden="true"></span>
            <span id="legend-yellow-label">Watch</span>
          </div>
          <div class="legend-item">
            <span class="legend-dot legend-orange" aria-hidden="true"></span>
            <span id="legend-orange-label">Warning</span>
          </div>
          <div class="legend-item">
            <span class="legend-dot legend-red" aria-hidden="true"></span>
            <span id="legend-red-label">Critical</span>
          </div>
        </div>
      </div>

    </section>

    <div class="wall" id="wall">
      <div class="state-msg">Loading panel…</div>
    </div>

    <section class="daily-question-section" aria-labelledby="daily-question-label">
      <div class="daily-question" id="daily-question-block">
        <div class="daily-question-label" id="daily-question-label">Question of the day</div>

        <div class="daily-question-text" id="daily-question-text">—</div>

        <details class="daily-question-original" id="daily-question-original" hidden>
          <summary id="daily-question-original-toggle">View original EN</summary>
          <div class="daily-question-original-label" id="daily-question-original-label">Original English</div>
          <div class="daily-question-original-text" id="daily-question-original-text">—</div>
        </details>
      </div>
    </section>

    <footer>
      <div class="footer-signature" id="footer-signature"></div>
    </footer>

  </main>

  <script src="./scripts/themes.js"></script>
  <script src="./scripts/i18n.js"></script>
  <script src="./scripts/weather-data.js"></script>
  <script>
    let CONFIG = null;
    let DATA = null;
    let PANEL_SYSTEMS = null;

    function fmtTodayNumeric() {
      const lang = NMi18n.lang();
      const d = new Date();
      const day = String(d.getDate()).padStart(2, "0");
      const month = String(d.getMonth() + 1).padStart(2, "0");
      // DD/MM everywhere (international standard) — MM/DD only for
      // English (US convention).
      return lang === "en" ? `${month}/${day}` : `${day}/${month}`;
    }

    function conditionMeta(key) {
      const label = NMi18n.t(`weather.${key}`);
      const reading = NMi18n.t(`interpretation.${key}`);
      return {
        label: label === `weather.${key}` ? (key || "").toUpperCase() : label,
        reading: reading === `interpretation.${key}` ? "—" : reading
      };
    }

    function translatedOrFallback(key, fallback) {
      const value = NMi18n.t(key);
      return value === key ? fallback : value;
    }

    function renderWallIntro() {
      const daily = (DATA && DATA.probe_contract && DATA.probe_contract.daily) || {};
      const originalQuestion = daily.question || "—";
      const currentLang = NMi18n.lang();

      // Presentation-only translations.
      // The canonical measured question remains daily.question in English.
      // Supported future shapes:
      //   daily.question_translations.fr
      //   daily.translations.fr
      //   daily.question_i18n.fr
      const translations =
        daily.question_translations ||
        daily.translations ||
        daily.question_i18n ||
        {};

      const translatedQuestion =
        currentLang === "en"
          ? originalQuestion
          : (translations[currentLang] || originalQuestion);

      document.getElementById("daily-question-label").textContent =
        translatedOrFallback("ui.question_of_day", "Question of the day");

      document.getElementById("daily-question-text").textContent =
        translatedQuestion;

      const originalBlock = document.getElementById("daily-question-original");
      const hasDistinctTranslation =
        currentLang !== "en" &&
        translatedQuestion &&
        translatedQuestion !== originalQuestion;

      originalBlock.hidden = !hasDistinctTranslation;

      if (hasDistinctTranslation) {
        document.getElementById("daily-question-original-toggle").textContent =
          translatedOrFallback("ui.view_original_en", "View original EN");

        document.getElementById("daily-question-original-label").textContent =
          translatedOrFallback("ui.original_english", "Original English");

        document.getElementById("daily-question-original-text").textContent =
          originalQuestion;
      }

      document.getElementById("legend-green-label").textContent =
        translatedOrFallback("judgment.j1", "Normal");

      document.getElementById("legend-yellow-label").textContent =
        translatedOrFallback("judgment.j2", "Watch");

      document.getElementById("legend-orange-label").textContent =
        translatedOrFallback("judgment.j3", "Warning");

      document.getElementById("legend-red-label").textContent =
        translatedOrFallback("judgment.j4", "Critical");
    }

    function renderHeader() {
      const currentLang = NMi18n.lang();

      // Product title is localized in the active language.
      // FR intentionally displays "La météo des IA" instead of "AI Weather".
      const titleFallback = currentLang === "fr"
        ? "La météo des IA"
        : "AI Weather";

      document.getElementById("title").innerHTML =
        `${translatedOrFallback("ui.ai_weather_title", titleFallback)} <span class="title-date">- ${fmtTodayNumeric()}</span>`;
      document.getElementById("brand-label").textContent = "CONTROLTOWER";

      if (DATA.demo) {
        document.getElementById("demo-flag-holder").innerHTML =
          `<div class="demo-flag">${NMi18n.t("ui.demo_flag")}</div>`;
      }
    }

    function renderFooter() {
      // Deliberately English-only, regardless of ?lang= — same product
      // decision as the AI Weather widgets' footer signature.
      document.getElementById("footer-signature").innerHTML =
        'ControlTower by <strong>NeoMundi</strong> - Machine-readable JSON &middot; Hash &amp; signature verifiable';
    }

    // Condition -> color and -> severity (0 = best, 3 = worst) used to
    // draw the 7-day trend sparkline on each card. Kept in sync by hand
    // with the CSS custom properties / legend colors used elsewhere in
    // this file (clear/watch/unsettled/alert).
    const CONDITION_COLOR = {
      clear: "#22c55e",
      watch: "#facc15",
      unsettled: "#fb923c",
      alert: "#b91c1c"
    };

    const CONDITION_SEVERITY = { clear: 0, watch: 1, unsettled: 2, alert: 3 };

    /**
     * Build a small inline SVG trend line from a chronological list of
     * { date, condition } points (oldest first, as returned by
     * NMData.getSystemHistory).
     *
     * - Each day is a dot, colored like the legend.
     * - Consecutive days are connected by a line segment.
     * - A day with an unrecognized/insufficient condition breaks the
     *   line (rendered as an isolated grey dot) rather than being
     *   interpolated — we don't want to imply a measured value that
     *   wasn't actually observed.
     * - The number of points is whatever NMData.loadHistory(7) could
     *   actually fetch (gaps in the archive are skipped upstream), so
     *   this renders correctly whether it gets 7, 5, or just 1 point.
     */
    function buildSparklineSvg(points) {
      if (!points || points.length === 0) return "";

      const W = 112;
      const H = 28;
      const PAD_X = 4;
      const PAD_Y = 4;

      const n = points.length;
      const stepX = n > 1 ? (W - PAD_X * 2) / (n - 1) : 0;

      const coords = points.map((p, i) => {
        const sev = CONDITION_SEVERITY[p.condition];
        return {
          x: PAD_X + stepX * i,
          y: sev === undefined ? H / 2 : PAD_Y + (sev / 3) * (H - PAD_Y * 2),
          condition: p.condition,
          valid: sev !== undefined
        };
      });

      const segments = [];
      let current = [];
      coords.forEach((c) => {
        if (c.valid) {
          current.push(c);
        } else if (current.length > 1) {
          segments.push(current);
          current = [];
        } else {
          current = [];
        }
      });
      if (current.length > 1) segments.push(current);

      const polylines = segments
        .map((seg) => {
          const pts = seg.map((c) => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ");
          return `<polyline points="${pts}" fill="none" stroke="var(--ink-faint)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.55" />`;
        })
        .join("");

      const dots = coords
        .map((c) => {
          if (c.valid) {
            return `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="2.3" fill="${CONDITION_COLOR[c.condition] || "var(--ink-faint)"}" />`;
          }
          return `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="2.3" class="card-sparkline-point-insufficient" />`;
        })
        .join("");

      return `<svg class="card-sparkline" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${polylines}${dots}</svg>`;
    }

    function renderCard(system, historyMap) {
      const identity = NMData.getPublicIdentity(system);
      const conditionLabel = conditionMeta(system.condition).label;
      const history = NMData.getSystemHistory(historyMap, system.id);

      const card = document.createElement("div");
      card.className = `card is-${system.condition}`;
      card.dataset.systemId = system.id;
      card.setAttribute("aria-label", `${identity.label} — ${conditionLabel}`);

      card.innerHTML = `
        <div class="card-state-line">
          <span class="card-state-dot" aria-hidden="true"></span>
          <div class="card-model">${identity.label}</div>
        </div>
        ${buildSparklineSvg(history)}
      `;

      return card;
    }

    function renderWall(historyMap) {
      const wall = document.getElementById("wall");
      wall.innerHTML = "";
      const systems = PANEL_SYSTEMS || [];

      if (systems.length === 0) {
        wall.innerHTML = '<div class="state-msg">No systems in the observed panel yet.</div>';
        return;
      }

      systems.forEach(system => wall.appendChild(renderCard(system, historyMap)));
    }

    // ---------- Theme selector ----------

    function currentTheme() {
      return document.documentElement.getAttribute("data-theme") || "light";
    }

    function renderThemeMenu() {
      const theme = currentTheme();
      const button = document.getElementById("theme-button");
      const menu = document.getElementById("theme-menu");

      button.textContent = `${theme.charAt(0).toUpperCase() + theme.slice(1)} ▾`;

      menu.querySelectorAll(".theme-option").forEach(option => {
        const isActive = option.dataset.theme === theme;
        option.classList.toggle("active", isActive);

        option.addEventListener("click", () => {
          const params = new URLSearchParams(window.location.search);
          params.set("theme", option.dataset.theme);
          window.location.search = params.toString();
        });
      });
    }

    document.getElementById("theme-button").addEventListener("click", () => {
      const menu = document.getElementById("theme-menu");
      const button = document.getElementById("theme-button");
      const willOpen = !menu.classList.contains("open");

      document.getElementById("lang-menu").classList.remove("open");
      document.getElementById("lang-button").setAttribute("aria-expanded", "false");

      menu.classList.toggle("open", willOpen);
      button.setAttribute("aria-expanded", String(willOpen));
    });

    // ---------- Language selector ----------

    function renderLangMenu() {
      const langConfig = NMi18n.getLanguagesConfig();
      const menu = document.getElementById("lang-menu");
      const current = NMi18n.lang();

      menu.innerHTML = (langConfig.available || []).map(l => `
        <button class="lang-option ${l.code === current ? "active" : ""}" data-lang="${l.code}" type="button">
          ${l.label}
        </button>
      `).join("");

      document.getElementById("lang-button").textContent = `${current.toUpperCase()} ▾`;

      menu.querySelectorAll(".lang-option").forEach(btn => {
        btn.addEventListener("click", () => {
          const params = new URLSearchParams(window.location.search);
          params.set("lang", btn.dataset.lang);
          window.location.search = params.toString();
        });
      });
    }

    document.getElementById("lang-button").addEventListener("click", () => {
      const menu = document.getElementById("lang-menu");
      const button = document.getElementById("lang-button");
      const willOpen = !menu.classList.contains("open");

      document.getElementById("theme-menu").classList.remove("open");
      document.getElementById("theme-button").setAttribute("aria-expanded", "false");

      menu.classList.toggle("open", willOpen);
      button.setAttribute("aria-expanded", String(willOpen));
    });

    document.addEventListener("click", (e) => {
      const langWrap = document.querySelector(".lang-select");
      const themeWrap = document.querySelector(".theme-select");

      if (langWrap && !langWrap.contains(e.target)) {
        document.getElementById("lang-menu").classList.remove("open");
        document.getElementById("lang-button").setAttribute("aria-expanded", "false");
      }

      if (themeWrap && !themeWrap.contains(e.target)) {
        document.getElementById("theme-menu").classList.remove("open");
        document.getElementById("theme-button").setAttribute("aria-expanded", "false");
      }
    });

    // ---------- Deep link (?system=) ----------

    function applyDeepLink(systems) {
      const targetId = NMData.getQueryParam("system");
      if (!targetId) return;

      const system = systems.find(s => s.id === targetId);
      if (!system) return;

      const card = document.querySelector(`.card[data-system-id="${CSS.escape(targetId)}"]`);
      if (card) {
        card.classList.add("deep-linked");
        card.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    }

    // ---------- Boot ----------

    NMThemes.init();

    Promise.all([
      NMi18n.init(),
      fetch("./config/wording.json").then(r => { if (!r.ok) throw new Error("config unavailable"); return r.json(); }),
      NMData.load(),
      NMData.loadPanels(),
      NMData.loadHistory(7).catch(() => ({}))
    ])
      .then(([lang, config, data, panelsConfig, historyMap]) => {
        CONFIG = config;
        DATA = data;

        const fullIds = (panelsConfig.panels && panelsConfig.panels.full) || (data.systems || []).map(s => s.id);
        PANEL_SYSTEMS = NMData.getPanelSystems(data, fullIds);

        renderHeader();
        renderWallIntro();
        renderWall(historyMap);
        renderFooter();
        renderThemeMenu();
        renderLangMenu();
        applyDeepLink(PANEL_SYSTEMS);
      })
      .catch(() => {
        document.getElementById("wall").innerHTML =
          '<div class="state-msg">AI Weather data currently unavailable.</div>';
      });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch(() => {});
      });
    }
  </script>

</body>
</html>
