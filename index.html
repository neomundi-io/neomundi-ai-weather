<script>
function openDetail(system) {
  const judgment = judgmentMeta(system.judgment_demand);
  const d = system.detail || {};
  const prevMeta = d.previous_condition ? conditionMeta(d.previous_condition) : null;
  const identity = NMData.getPublicIdentity(system);

  const previousJudgmentMap = {
    clear: "judgment.j1",
    watch: "judgment.j2",
    unsettled: "judgment.j3",
    alert: "judgment.j4"
  };

  const previousJudgmentKey = d.previous_condition
    ? previousJudgmentMap[d.previous_condition]
    : null;

  const previousJudgment = previousJudgmentKey
    ? translatedOrFallback(previousJudgmentKey, prevMeta ? prevMeta.label : "—")
    : NMi18n.t("ui.no_prior");

  document.getElementById("detail-sheet").innerHTML = `
    <div class="detail-header">
      <div class="detail-condition is-${system.condition}">
        <span class="dot" aria-hidden="true"></span>
      </div>

      <button class="detail-close" id="detail-close-btn">
        ${NMi18n.t("ui.close")}
      </button>
    </div>

    <div class="detail-reading">${identity.label}</div>

    <div class="detail-block">
      <div class="detail-positioning">
        ${translatedOrFallback(
          "ui.measurement_claim",
          "Contrairement à un benchmark classique, ControlTower ne cherche pas à classer les IA : nous répétons une même situation 30 fois pour mesurer leur comportement et transformer cette mesure en signal de décision."
        )}
      </div>
    </div>

    <div class="detail-block detail-governance">
      <div class="detail-block-label">
        ${translatedOrFallback(
          "ui.governance_recommendation",
          "Recommandation de gouvernance"
        )}
      </div>

      <div class="detail-governance-value">
        ${judgment.meaning}
      </div>
    </div>

    <div class="detail-block">
      <div class="detail-block-label">
        ${translatedOrFallback(
          "ui.last_observed",
          "Dernière observation"
        )}
      </div>

      <div class="detail-meta-row">
        <span>${fmtDate(system.last_observed_at)}</span>
      </div>
    </div>

    <div class="detail-block">
      <div class="detail-block-label">
        ${NMi18n.t("ui.previous_label")}
      </div>

      <div class="detail-previous">
        ${
          d.previous_condition
            ? `<span class="detail-previous-dot is-${d.previous_condition}" aria-hidden="true"></span>`
            : ""
        }
        <span>${previousJudgment}</span>
      </div>
    </div>

    <div class="detail-links">
      <a
        href="https://controltowerai.io/ai-weather/"
        target="_blank"
        rel="noopener"
      >
        ${translatedOrFallback(
          "ui.install_widget_free",
          "Installer gratuitement ce widget sur votre site →"
        )}
      </a>

      <a
        href="https://controltowerai.io/ai-weather/methodology/"
        target="_blank"
        rel="noopener"
      >
        ${translatedOrFallback(
          "ui.how_measure_built",
          "Voir comment cette mesure est construite →"
        )}
      </a>
    </div>

    <div class="detail-signature">
      ${translatedOrFallback(
        "ui.controltower_signature",
        "ControlTower by NeoMundi transforme la mesure scientifique du comportement des IA en pouvoir de décision."
      )}
    </div>
  `;

  document
    .getElementById("detail-close-btn")
    .addEventListener("click", closeDetail);

  document
    .getElementById("detail-overlay")
    .classList.add("open");
}
</script>
